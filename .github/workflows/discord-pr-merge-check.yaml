---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Discord merge boundary

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/discord-pr-merge-check.yaml
      - kubernetes/apps/ai/hermes/app/discord-review/**
      - kubernetes/apps/ai/hermes/app/helmrelease.yaml
      - kubernetes/apps/ai/hermes/app/kustomization.yaml
      - scripts/check-discord-pr-merge.py

permissions:
  contents: read

jobs:
  check:
    name: Discord merge boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise authorization and stale-commit rejection
        run: python3 scripts/check-discord-pr-merge.py
