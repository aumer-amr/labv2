---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Hygiene

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: PR Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install check tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.25
          install_args: node zizmor yq lefthook flux2
          cache: false

      - name: Install formatter after Node
        run: mise install --locked oxfmt

      - name: Check PR changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: mise exec -- python3 scripts/ci/check-pr-hygiene.py "$PR_BASE" "$PR_HEAD"

      - name: Check CI gate regressions
        run: |
          mise exec -- python3 tests/ci/check-pr-ci.py
          mise exec -- python3 tests/ci/check-kubernetes-conventions-test.py
          python3 tests/ci/check-pr-rendered-summary.py
