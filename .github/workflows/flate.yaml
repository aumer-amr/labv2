---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flate"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/*

  flate:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5

      - name: Run Flate
        id: flate
        run: flate test all -p ./kubernetes/flux/cluster

  success:
    if: ${{ always() }}
    needs: [filter, flate]
    name: Flate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Require validation or a confirmed no-change skip
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          FLATE_RESULT: ${{ needs.flate.result }}
          CHANGED_FILES: ${{ needs.filter.outputs.changed-files }}
        shell: python
        run: |
          import json
          import os
          import sys

          if os.environ["FILTER_RESULT"] != "success":
              sys.exit("Flate filter did not succeed")
          changed = json.loads(os.environ["CHANGED_FILES"])
          if not isinstance(changed, list) or not all(isinstance(path, str) for path in changed):
              sys.exit("Invalid changed-file output")
          expected = "success" if changed else "skipped"
          if os.environ["FLATE_RESULT"] != expected:
              sys.exit(f"Expected Flate to be {expected}")
          print("Flate passed" if changed else "No Kubernetes changes; validation skipped")
