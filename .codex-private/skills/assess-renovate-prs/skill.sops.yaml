              "reference": "https://github.com/onedr0p/home-ops/pull/2",
          },
      ]
      assert [item["new"] for item in version_chain("2026.7.3", "2026.8.1", transitions)] == [
          "2026.8.0",
          "2026.8.1",
      ]
      direct = [
          *transitions,
          {
              "old": "2026.7.3",
              "new": "2026.8.1",
              "reference": "https://github.com/onedr0p/home-ops/pull/3",
          },
      ]
      assert len(version_chain("2026.7.3", "2026.8.1", direct)) == 1
      try:
          version_chain("2026.7.3", "2026.8.2", transitions)
      except AssessmentError:
          pass
      else:
          raise AssertionError("gapped version chain was accepted")


  def main() -> int:
      parser = argparse.ArgumentParser()
      subparsers = parser.add_subparsers(dest="command", required=True)
      collect_parser = subparsers.add_parser("collect")
      collect_parser.add_argument("--pr", action="append", default=[])
      subparsers.add_parser("begin-weekly")
      subparsers.add_parser("complete-weekly")
      output_parser = subparsers.add_parser("validate-output")
      output_parser.add_argument("--file", type=Path, required=True)
      finalize_parser = subparsers.add_parser("finalize")
      finalize_parser.add_argument("--evidence", type=Path, required=True)
      finalize_parser.add_argument("--report", type=Path, required=True)
      merge_parser = subparsers.add_parser("merge")
      merge_parser.add_argument("--evidence", type=Path, required=True)
      request_parser = subparsers.add_parser("request-merge")
      request_parser.add_argument("--evidence", type=Path, required=True)
      request_parser.add_argument("--report", type=Path, required=True)
      request_parser.add_argument("--url", default="http://127.0.0.1:9171/merge")
      finalize_request_parser = subparsers.add_parser("finalize-and-request-merge")
      finalize_request_parser.add_argument("--evidence", type=Path, required=True)
      finalize_request_parser.add_argument("--report", type=Path, required=True)
      finalize_request_parser.add_argument("--url", default="http://127.0.0.1:9171/merge")
      confirm_parser = subparsers.add_parser("confirm-rollout")
      confirm_parser.add_argument("--merge-sha", required=True)
      confirm_parser.add_argument("--url", default="http://127.0.0.1:9171/rollout-health")
      serve_parser = subparsers.add_parser("serve")
      serve_parser.add_argument("--host", default="127.0.0.1")
      serve_parser.add_argument("--port", type=int, default=9171)
      cleanup_parser = subparsers.add_parser("cleanup")
      cleanup_parser.add_argument("--evidence", type=Path, required=True)
      chain_parser = subparsers.add_parser("chain")
      chain_parser.add_argument("--start", required=True)
      chain_parser.add_argument("--target", required=True)
      chain_parser.add_argument("--transitions", type=Path, required=True)
      subparsers.add_parser("self-test")
      args = parser.parse_args()
      try:
          if args.command == "collect":
              collect(args.pr)
          elif args.command == "begin-weekly":
              begin_weekly_run()
          elif args.command == "complete-weekly":
              complete_weekly_run()
          elif args.command == "validate-output":
              validate_generated_output(args.file)
          elif args.command == "finalize":
              finalize(args.evidence, args.report)
          elif args.command == "merge":
              print(json.dumps(merge_recommended(args.evidence), indent=2))
          elif args.command == "request-merge":
              request_merge(args.evidence, args.report, args.url)
          elif args.command == "finalize-and-request-merge":
              finalize_and_request_merge(args.evidence, args.report, args.url)
          elif args.command == "confirm-rollout":
              request_rollout_confirmation(args.merge_sha, args.url)
          elif args.command == "serve":
              serve(args.host, args.port)
          elif args.command == "cleanup":
              cleanup(args.evidence)
          elif args.command == "chain":
              resolve_chain(args.transitions, args.start, args.target)
          else:
              self_test()
      except (AssessmentError, json.JSONDecodeError, UnicodeDecodeError) as error:
          print(str(error), file=sys.stderr)
          return 1
      return 0


  if __name__ == "__main__":
      raise SystemExit(main())
runner_sh: |
  #!/bin/sh
  set -eu

  helper=/opt/data/skills/private/assess-renovate-prs/scripts/assessment.py
  prompt_file=/opt/data/private-prompts/assess-renovate-prs.txt
  workspace=/opt/data/renovate-workspace
  stale_script=/opt/data/run_remaining_assessments.py
  session_snapshot=

  session_ids() {
      hermes sessions list --workspace "$workspace" --limit 10000 | awk 'NR > 2 && $NF ~ /^[0-9]{8}_[0-9]{6}_[0-9a-f]+$/ { print $NF }' | sort -u
  }

  cleanup_sessions() {
      [ -n "$session_snapshot" ] && [ -f "$session_snapshot" ] || return 0
      current_sessions="$data_root/sessions-current.txt"
      session_ids >"$current_sessions"
      comm -13 "$session_snapshot" "$current_sessions" | while IFS= read -r session_id; do
          [ -n "$session_id" ] || continue
          hermes sessions delete --yes "$session_id" >/dev/null
      done
      mv "$current_sessions" "$session_snapshot"
  }

  cleanup() {
      cleanup_sessions >/dev/null 2>&1 || true
      "$helper" cleanup-weekly >/dev/null 2>&1 || true
      rm -f -- "$stale_script"
  }

  rm -f -- "$stale_script"
  trap cleanup EXIT INT TERM
  cd "$workspace"
  "$helper" begin-weekly >/dev/null
  data_root=$("$helper" paths | sed -n 's/.*"data_root": "\([^"]*\)".*/\1/p')
  [ -n "$data_root" ]
  output="$data_root/weekly-output.txt"
  session_snapshot="$data_root/sessions-before.txt"
  session_ids >"$session_snapshot"

  while next=$("$helper" weekly-next) && [ -n "$next" ]; do
      set -- $next
      pr=$1
      head_sha=$2
      before_pr="$data_root/sessions-before-$pr.txt"
      after_pr="$data_root/sessions-after-$pr.txt"
      session_ids >"$before_pr"
      attempt=1
      while [ "$attempt" -le 3 ]; do
          if [ "$attempt" -eq 1 ]; then
              prompt=$(printf '%s\n\nAssess only PR #%s at immutable head %s. Complete its finalize, broker, rollout, and cleanup cycle before returning.' "$(cat "$prompt_file")" "$pr" "$head_sha")
              hermes --in "$workspace" --skills assess-renovate-prs --oneshot "$prompt" >"$output"
              session_ids >"$after_pr"
              session_id=$(comm -13 "$before_pr" "$after_pr")
              [ -n "$session_id" ] && [ "$(printf '%s\n' "$session_id" | wc -l)" -eq 1 ]
          else
              prompt=$(printf 'PR #%s at immutable head %s is still incomplete. Continue this PR only in the same session. Finish its finalize, broker, rollout, and cleanup cycle now. Do not assess another PR, delegate, generate scripts, or return a progress summary.\n' "$pr" "$head_sha")
              hermes --in "$workspace" --resume "$session_id" --skills assess-renovate-prs --oneshot "$prompt" >"$output"
          fi
          "$helper" validate-output --file "$output"
          if "$helper" weekly-status --pr "$pr" >/dev/null 2>&1; then
              break
          fi
          attempt=$((attempt + 1))
      done
      "$helper" weekly-status --pr "$pr" >/dev/null
  done

  summary=$("$helper" weekly-summary)
  cleanup_sessions
  "$helper" complete-weekly >/dev/null
  printf '%s\n' "$summary"
