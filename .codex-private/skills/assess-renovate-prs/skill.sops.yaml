broker_py: |
  #!/usr/bin/env python3
  """Collect immutable Renovate PR evidence and atomically publish its report."""

  from __future__ import annotations

  import argparse
  from collections import deque
  import datetime as dt
  import hashlib
  from http.server import BaseHTTPRequestHandler, HTTPServer
  import json
  import os
  import re
  import shutil
  import ssl
  import subprocess
  import sys
  import tempfile
  import uuid
  from pathlib import Path
  from urllib.error import HTTPError, URLError
  from urllib.parse import quote, urlparse
  from urllib.request import Request, urlopen

  REPO_ROOT = Path.cwd().resolve()
  REPORT_FILE = REPO_ROOT / "renovate-assessment.md"

  EXCHANGE_ROOT = Path(
      os.environ.get("HERMES_ASSESSMENT_EXCHANGE", "/run/assessment-exchange")
  ).resolve()

  WORKSPACE_ROOT = EXCHANGE_ROOT / "workspaces"

  WEEKLY_LEDGER = EXCHANGE_ROOT / "weekly-assessment-ledger.json"
  TARGET_REPO = "aumer-amr/labv2"
  EXPECTED_ORIGIN = "https://github.com/aumer-amr/labv2.git"
  HOME_REPO = "onedr0p/home-ops"
  HOME_URL = "https://github.com/onedr0p/home-ops.git"
  TRUSTED_AUTHORS = {"app/labv2-bot", "app/renovate", "renovate[bot]"}
  EVIDENCE_SCHEMA = 2

  LEDGER_SCHEMA = 1
  VERDICTS = {
      "matching change remains in desired state",
      "matching change required follow-up fixes",
      "newer version chain remains in desired state",
      "materially different configuration",
      "no matching deployment found",
      "insufficient evidence",
  }
  RECOMMENDATIONS = {"merge", "adapt", "wait", "investigate"}
  MATCH_FORMS = {
      "exact transition",
      "contiguous split chain",
      "gapped chain",
      "no comparable deployment",
  }
  DECISION_MARKER = re.compile(r"^<!-- assessment-decision: (\{[^\n]+\}) -->$", re.MULTILINE)

  VISIBLE_RECOMMENDATION = re.compile(
      r"^Recommendation:\s*`(merge|adapt|wait|investigate)`\s*$",
      re.IGNORECASE | re.MULTILINE,
  )
  MERGE_EXCLUDED_PATHS = (
      ".codex-private/skills/",
      "kubernetes/apps/ai/hermes/",
      "kubernetes/apps/ai/litellm/",
  )
  PASSING_CHECK_CONCLUSIONS = {"SUCCESS", "NEUTRAL", "SKIPPED"}
  MAX_MERGE_EVIDENCE_AGE = dt.timedelta(hours=6)
  ROLLOUT_STATE_FILE = Path("/var/lib/hermes-broker/pending-rollout.json")
  KUBE_TOKEN_FILE = Path("/var/run/secrets/kubernetes.io/serviceaccount/token")
  KUBE_CA_FILE = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

  REVISION = re.compile(r"refs/heads/main@sha1:([0-9a-f]{40})")

  ERROR_LOG_MARKER = re.compile(
      r"(?im)(?:^|\s)(?:level[=:]\s*)?(?:error|exception|fatal|panic|traceback)(?:\s|[:=])"
  )
  SECRET_MARKERS = (
      re.compile(rb"AGE-SECRET-KEY", re.IGNORECASE),
      re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
      re.compile(rb"\b(?:gh[opusr]|github_pat)_[A-Za-z0-9_]{20,}\b"),
      re.compile(rb"\beyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\b"),
      re.compile(rb"(?im)^\s*(?:authorization|proxy-authorization)\s*:\s*(?:basic|bearer)\s+\S+"),
      re.compile(
          rb"(?im)\b(?:api[_-]?key|client[_-]?secret|password|token)\s*[:=]\s*['\"]?[A-Za-z0-9_./+=-]{12,}"
      ),
  )


  class AssessmentError(RuntimeError):
      pass


  def run(
      args: list[str],
      *,
      cwd: Path = REPO_ROOT,
      input_bytes: bytes | None = None,
      timeout: int = 300,
  ) -> bytes:
      try:
          result = subprocess.run(
              args,
              cwd=cwd,
              input=input_bytes,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              check=False,
              timeout=timeout,
          )
      except subprocess.TimeoutExpired as error:
          raise AssessmentError("Command timed out safely") from error
      if result.returncode:
          raise AssessmentError(f"Command failed safely: {' '.join(args[:2])}")
      return result.stdout


  def git(*args: str, cwd: Path = REPO_ROOT) -> str:
      return run(["git", *args], cwd=cwd).decode().strip()


  def gh_json(args: list[str]) -> object:
      return json.loads(run([*tool_command("gh"), *args]).decode())


  def tool_command(name: str) -> list[str]:
      direct = shutil.which(name)
      if direct:
          return [direct]
      mise = shutil.which("mise")
      if mise:
          return [mise, "exec", "--", name]
      raise AssessmentError(f"Required tool is unavailable: {name}")


  def normalize_origin(url: str) -> str:
      if url.startswith("git@github.com:"):
          return "https://github.com/" + url.removeprefix("git@github.com:")
      return url


  def repository_snapshot() -> tuple[str, str]:
      origin = normalize_origin(git("remote", "get-url", "origin"))
      if origin != EXPECTED_ORIGIN:
          raise AssessmentError("Unexpected origin repository")
      head = git("rev-parse", "HEAD")
      status = run(["git", "status", "--porcelain=v1", "-z", "--untracked-files=all"])
      return head, hashlib.sha256(status).hexdigest()


  def assert_repository_unchanged(head: str, status_digest: str) -> None:
      current_head, current_digest = repository_snapshot()
      if current_head != head or current_digest != status_digest:
          raise AssessmentError("Repository changed during assessment")


  def parse_pr(value: str) -> int:
      if value.isdigit() and int(value) > 0:
          return int(value)
      parsed = urlparse(value)
      match = re.fullmatch(r"/aumer-amr/labv2/pull/([1-9][0-9]*)/?", parsed.path)
      if parsed.scheme == "https" and parsed.netloc == "github.com" and match:
          return int(match.group(1))
      raise AssessmentError("PR must belong to aumer-amr/labv2")


  def trusted_author(value: object) -> bool:
      return isinstance(value, dict) and value.get("login") in TRUSTED_AUTHORS


  PR_FIELDS = ",".join(
      (
          "number",
          "url",
          "title",
          "body",
          "state",
          "isDraft",
          "author",
          "baseRefName",
          "baseRefOid",
          "changedFiles",
          "headRefName",
          "headRefOid",
          "mergeStateStatus",
          "reviewDecision",
          "files",
          "commits",
          "reviews",
          "comments",
          "statusCheckRollup",
          "labels",
          "updatedAt",
      )
  )


  def read_pr(number: int) -> dict[str, object]:
      data = gh_json(["pr", "view", str(number), "--repo", TARGET_REPO, "--json", PR_FIELDS])
      if not isinstance(data, dict) or data.get("number") != number:
          raise AssessmentError("Invalid PR metadata")
      if data.get("url") != f"https://github.com/{TARGET_REPO}/pull/{number}":
          raise AssessmentError("PR base repository mismatch")
      if not trusted_author(data.get("author")):
          raise AssessmentError(f"PR #{number} is not authored by trusted Renovate")
      for field in ("baseRefOid", "headRefOid"):
          if not re.fullmatch(r"[0-9a-f]{40}", str(data.get(field, ""))):
              raise AssessmentError(f"PR #{number} has invalid immutable metadata")
      if not isinstance(data.get("changedFiles"), int) or int(data["changedFiles"]) < 0:
          raise AssessmentError(f"PR #{number} has an invalid changed-file count")
      return data


  def open_pr_numbers(*, reader=gh_json) -> list[int]:
      pages = reader(
              [
                  "api",
                  "--paginate",
                  "--slurp",
                  f"repos/{TARGET_REPO}/pulls?state=open&per_page=100",
              ]
          )
      if not isinstance(pages, list) or not all(isinstance(page, list) for page in pages):
          raise AssessmentError("Invalid PR list")
      listed = [item for page in pages for item in page]
      if not all(
          isinstance(item, dict)
          and isinstance(item.get("number"), int)
          and item["number"] > 0
          and isinstance(item.get("user"), dict)
          for item in listed
      ):
          raise AssessmentError("Invalid PR list entry")
      return [item["number"] for item in listed if trusted_author(item["user"])]


  def select_prs(requested: list[str]) -> list[dict[str, object]]:
      if requested:
          numbers = list(dict.fromkeys(parse_pr(value) for value in requested))
      else:
          numbers = open_pr_numbers()
      return [read_pr(number) for number in numbers]


  def selected_heads(pull_requests: list[dict[str, object]]) -> list[tuple[int, str]]:
      return sorted((int(item["number"]), str(item["headRefOid"])) for item in pull_requests)


  def same_selection(
      expected: list[dict[str, object]],
      current: list[dict[str, object]],
  ) -> bool:
      return selected_heads(expected) == selected_heads(current)


  def clone_repository(url: str, destination: Path) -> None:
      run(
          ["git", "clone", "--quiet", "--filter=blob:none", "--no-checkout", url, str(destination)],
          cwd=destination.parent,
          timeout=600,
      )


  def home_default() -> tuple[str, str]:
      data = gh_json(["repo", "view", HOME_REPO, "--json", "defaultBranchRef"])
      if not isinstance(data, dict) or not isinstance(data.get("defaultBranchRef"), dict):
          raise AssessmentError("Invalid home-ops default branch")
      branch = str(data["defaultBranchRef"].get("name", ""))
      commit = gh_json(["api", f"repos/{HOME_REPO}/commits/{branch}"])
      sha = commit.get("sha") if isinstance(commit, dict) else None
      if not branch or not re.fullmatch(r"[0-9a-f]{40}", str(sha or "")):
          raise AssessmentError("Invalid home-ops default branch metadata")
      return branch, str(sha)


  def safe_workspace(path: Path) -> Path:
      resolved = path.resolve()
      if resolved.parent != WORKSPACE_ROOT or not resolved.name.startswith("assess-renovate-prs-"):
          raise AssessmentError("Unsafe assessment workspace")
      return resolved


  def remove_workspace(path: Path) -> None:
      resolved = safe_workspace(path)
      shutil.rmtree(resolved)
      if resolved.exists():
          raise AssessmentError("Assessment workspace cleanup failed")


  def collect(requested: list[str]) -> None:
      repository_head, status_digest = repository_snapshot()
      pull_requests = select_prs(requested)
      home_branch, home_head = home_default()
      WORKSPACE_ROOT.mkdir(mode=0o700, parents=True, exist_ok=True)
      workspace = safe_workspace(
          Path(tempfile.mkdtemp(prefix="assess-renovate-prs-", dir=WORKSPACE_ROOT))
      )
      workspace.chmod(0o700)
      evidence_path = EXCHANGE_ROOT / f"assess-renovate-prs-evidence-{uuid.uuid4().hex}.json"
      try:
          local_clone = workspace / "labv2"
          home_clone = workspace / "home-ops"
          clone_repository(EXPECTED_ORIGIN, local_clone)
          clone_repository(HOME_URL, home_clone)
          for pull_request in pull_requests:
              number = str(pull_request["number"])
              run(
                  ["git", "fetch", "--quiet", "origin", f"pull/{number}/head:refs/pr/{number}"],
                  cwd=local_clone,
                  timeout=300,
              )
              if git("rev-parse", f"refs/pr/{number}", cwd=local_clone) != pull_request["headRefOid"]:
                  raise AssessmentError(f"PR #{number} head changed during collection")
          if git("rev-parse", f"origin/{home_branch}", cwd=home_clone) != home_head:
              raise AssessmentError("home-ops changed during collection")
          evidence = {
              "schema": EVIDENCE_SCHEMA,
              "checked_at": dt.datetime.now(dt.timezone.utc).isoformat(),
              "selection_mode": "explicit" if requested else "all_open",
              "target_repository": TARGET_REPO,
              "repository_head": repository_head,
              "repository_status_digest": status_digest,
              "workspace": str(workspace),
              "local_clone": str(local_clone),
              "home_repository": HOME_REPO,
              "home_clone": str(home_clone),
              "home_default_branch": home_branch,
              "home_head": home_head,
              "pull_requests": pull_requests,
          }
          encoded_evidence = (json.dumps(evidence, indent=2) + "\n").encode()
          if report_has_secret_marker(encoded_evidence):
              raise AssessmentError("Evidence contains a secret-like value")
          evidence_path.write_bytes(encoded_evidence)
          evidence_path.chmod(0o600)
          assert_repository_unchanged(repository_head, status_digest)
      except BaseException:
          remove_workspace(workspace)
          evidence_path.unlink(missing_ok=True)
          raise
      print(evidence_path)


  def read_temporary_file(
      path: Path,
      label: str,
      maximum_size: int,
      temporary_directory: Path | None = None,
  ) -> bytes:
      try:
          resolved = path.resolve(strict=True)
          allowed_parent = (temporary_directory or Path(tempfile.gettempdir())).resolve()
          if path.is_symlink() or resolved.parent != allowed_parent:
              raise AssessmentError(f"{label} must be a direct file in the system temporary directory")
          if not resolved.is_file() or resolved.stat().st_size > maximum_size:
              raise AssessmentError(f"{label} is invalid or too large")
          return resolved.read_bytes()
      except OSError as error:
          raise AssessmentError(f"{label} is unavailable") from error


  def load_evidence(
      path: Path,
  ) -> dict[str, object]:
      raw = read_temporary_file(path, "Evidence", 5_000_000, EXCHANGE_ROOT)
      try:
          data = json.loads(raw)
      except (json.JSONDecodeError, UnicodeDecodeError) as error:
          raise AssessmentError("Assessment evidence is invalid") from error
      if not isinstance(data, dict):
          raise AssessmentError("Assessment evidence is invalid")
      if data.get("schema") != EVIDENCE_SCHEMA or data.get("target_repository") != TARGET_REPO:
          raise AssessmentError("Unsupported assessment evidence")
      safe_workspace(Path(str(data.get("workspace", ""))))
      return data


  def report_has_secret_marker(report: bytes) -> bool:
      return any(pattern.search(report) for pattern in SECRET_MARKERS)


  def report_decisions(report: bytes, evidence: dict[str, object]) -> dict[int, dict[str, object]]:
      text = report.decode("utf-8", errors="strict")
      decisions: dict[int, dict[str, object]] = {}
      previous_end = 0
      for match in DECISION_MARKER.finditer(text):
          section = text[previous_end : match.start()]
          previous_end = match.end()
          try:
              decision = json.loads(match.group(1))
          except json.JSONDecodeError as error:
              raise AssessmentError("Assessment decision is malformed") from error
          if not isinstance(decision, dict):
              raise AssessmentError("Assessment decision is invalid")
          if set(decision) != {"head_sha", "number", "recommendation"}:
              raise AssessmentError("Assessment decision has unsupported fields")
          number = decision.get("number")
          head_sha = decision.get("head_sha")
          recommendation = decision.get("recommendation")
          if (
              not isinstance(number, int)
              or number <= 0
              or not isinstance(head_sha, str)
              or re.fullmatch(r"[0-9a-f]{40}", head_sha) is None
              or recommendation not in RECOMMENDATIONS
          ):
              raise AssessmentError("Assessment decision is invalid")
          if number in decisions:
              raise AssessmentError(f"Assessment has duplicate decision for PR #{number}")
          visible = [value.lower() for value in VISIBLE_RECOMMENDATION.findall(section)]
          if visible != [recommendation]:
              raise AssessmentError(
                  f"Visible recommendation disagrees with decision for PR #{number}"
              )
          if f"#{number}" not in section or head_sha not in section:
              raise AssessmentError(f"Decision is not attached to PR #{number}")
          decisions[number] = decision
      if VISIBLE_RECOMMENDATION.search(text[previous_end:]):
          raise AssessmentError("Report has a recommendation without a decision")
      pull_requests = evidence.get("pull_requests")
      if not isinstance(pull_requests, list):
          raise AssessmentError("Invalid PR evidence")
      expected: dict[int, str] = {}
      for item in pull_requests:
          if (
              not isinstance(item, dict)
              or not isinstance(item.get("number"), int)
              or item["number"] <= 0
              or re.fullmatch(r"[0-9a-f]{40}", str(item.get("headRefOid", ""))) is None
              or item["number"] in expected
          ):
              raise AssessmentError("Invalid PR evidence entry")
          expected[item["number"]] = str(item["headRefOid"])
      if set(decisions) != set(expected):
          raise AssessmentError("Assessment decisions do not cover the selected PRs exactly")
      for number, head_sha in expected.items():
          if decisions[number]["head_sha"] != head_sha:
              raise AssessmentError(f"Assessment decision head mismatch for PR #{number}")
      return decisions


  def validate_report(report: bytes, evidence: dict[str, object]) -> None:
      if not report.strip() or len(report) > 2_000_000:
          raise AssessmentError("Report is empty or too large")
      if report_has_secret_marker(report):
          raise AssessmentError("Report contains a secret-like value")
      text = report.decode("utf-8", errors="strict").lower()
      pull_requests = evidence.get("pull_requests")
      if not isinstance(pull_requests, list):
          raise AssessmentError("Invalid PR evidence")
      report_decisions(report, evidence)
      if not pull_requests and "no open renovate" not in text:
          raise AssessmentError("Empty selection report must state no open Renovate PRs")
      for pull_request in pull_requests:
          number = pull_request.get("number")
          head = str(pull_request.get("headRefOid", ""))
          if f"#{number}" not in text or head not in text:
              raise AssessmentError(f"Report does not identify PR #{number} and its head SHA")
      if pull_requests and not any(verdict in text for verdict in VERDICTS):
          raise AssessmentError("Report has no supported verdict")
      if pull_requests and not any(match_form in text for match_form in MATCH_FORMS):
          raise AssessmentError("Report has no supported match form")


  def validate_generated_output(path: Path) -> None:
      output = read_temporary_file(path, "Generated output", 2_000_000, EXCHANGE_ROOT)
      if not output.strip() or report_has_secret_marker(output):
          raise AssessmentError("Generated output is empty or contains a secret-like value")


  def load_weekly_ledger(path: Path = WEEKLY_LEDGER) -> dict[str, object]:
      try:
          ledger = json.loads(read_temporary_file(path, "Weekly ledger", 1_000_000, EXCHANGE_ROOT))
      except (json.JSONDecodeError, UnicodeDecodeError) as error:
          raise AssessmentError("Weekly assessment ledger is invalid") from error
      if (
          not isinstance(ledger, dict)
          or set(ledger) != {"finalized", "schema", "selected"}
          or ledger.get("schema") != LEDGER_SCHEMA
          or not isinstance(ledger.get("selected"), list)
          or not all(isinstance(number, int) and number > 0 for number in ledger["selected"])
          or len(set(ledger["selected"])) != len(ledger["selected"])
          or not isinstance(ledger.get("finalized"), dict)
      ):
          raise AssessmentError("Weekly assessment ledger is invalid")
      return ledger


  def write_weekly_ledger(ledger: dict[str, object], path: Path = WEEKLY_LEDGER) -> None:
      temporary = path.with_suffix(".tmp")
      temporary.write_text(json.dumps(ledger, sort_keys=True) + "\n", encoding="utf-8")
      temporary.chmod(0o600)
      os.replace(temporary, path)


  def begin_weekly_run(path: Path = WEEKLY_LEDGER) -> None:
      EXCHANGE_ROOT.mkdir(mode=0o700, parents=True, exist_ok=True)
      if path.exists():
          raise AssessmentError("Previous weekly assessment is incomplete")
      selected = open_pr_numbers()
      descriptor = os.open(path, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
      with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
          json.dump({"finalized": {}, "schema": LEDGER_SCHEMA, "selected": selected}, handle)
          handle.write("\n")
      print(path)


  def record_weekly_outcomes(decisions: dict[int, dict[str, object]]) -> None:
      if not WEEKLY_LEDGER.exists():
          return
      ledger = load_weekly_ledger()
      selected = set(ledger["selected"])
      finalized = ledger["finalized"]
      if not isinstance(finalized, dict):
          raise AssessmentError("Weekly assessment ledger is invalid")
      for number, decision in decisions.items():
          key = str(number)
          if number not in selected or key in finalized:
              raise AssessmentError(f"PR #{number} is not pending in the weekly ledger")
          finalized[key] = {
              "head_sha": decision["head_sha"],
              "recommendation": decision["recommendation"],
          }
      write_weekly_ledger(ledger)


  def complete_weekly_run(path: Path = WEEKLY_LEDGER) -> None:
      ledger = load_weekly_ledger(path)
      expected = {str(number) for number in ledger["selected"]}
      finalized = ledger["finalized"]
      if not isinstance(finalized, dict) or set(finalized) != expected:
          raise AssessmentError("Weekly assessment did not finalize every initially selected PR")
      path.unlink()


  def revalidate_remote_heads(evidence: dict[str, object]) -> None:
      branch, head = home_default()
      if branch != evidence["home_default_branch"] or head != evidence["home_head"]:
          raise AssessmentError("home-ops changed after collection")
      pull_requests = evidence["pull_requests"]
      if evidence.get("selection_mode") == "all_open":
          if not same_selection(pull_requests, select_prs([])):
              raise AssessmentError("Open trusted Renovate PR selection changed after collection")
          return
      if evidence.get("selection_mode") != "explicit":
          raise AssessmentError("Invalid PR selection mode")
      for pull_request in pull_requests:
          current = read_pr(int(pull_request["number"]))
          if current["headRefOid"] != pull_request["headRefOid"]:
              raise AssessmentError(f"PR #{pull_request['number']} changed after collection")


  VERSION = re.compile(r"[0-9A-Za-z][0-9A-Za-z._+:/@-]{0,127}")
  HOME_REFERENCE = re.compile(
      r"https://github\.com/onedr0p/home-ops/(?:pull/[1-9][0-9]*|commit/[0-9a-f]{40})"
  )


  def version_chain(
      start: str,
      target: str,
      transitions: list[dict[str, object]],
  ) -> list[dict[str, str]]:
      if not VERSION.fullmatch(start) or not VERSION.fullmatch(target):
          raise AssessmentError("Invalid version endpoint")
      adjacency: dict[str, list[dict[str, str]]] = {}
      for transition in transitions:
          if set(transition) != {"old", "new", "reference"}:
              raise AssessmentError("Transition must contain old, new, and reference")
          old = transition["old"]
          new = transition["new"]
          reference = transition["reference"]
          if not all(isinstance(value, str) for value in (old, new, reference)):
              raise AssessmentError("Transition values must be strings")
          if not VERSION.fullmatch(old) or not VERSION.fullmatch(new):
              raise AssessmentError("Invalid transition version")
          if not HOME_REFERENCE.fullmatch(reference):
              raise AssessmentError("Transition reference must be a public home-ops PR or commit URL")
          adjacency.setdefault(old, []).append(
              {"old": old, "new": new, "reference": reference}
          )
      queue = deque([(start, [])])
      visited = {start}
      while queue:
          version, chain = queue.popleft()
          if version == target:
              return chain
          for transition in sorted(
              adjacency.get(version, []), key=lambda item: (item["new"], item["reference"])
          ):
              next_version = transition["new"]
              if next_version not in visited:
                  visited.add(next_version)
                  queue.append((next_version, [*chain, transition]))
      raise AssessmentError(f"No contiguous version chain from {start} to {target}")


  def resolve_chain(path: Path, start: str, target: str) -> None:
      if (
          path.parent.resolve() != Path(tempfile.gettempdir()).resolve()
          or not path.is_file()
          or path.stat().st_size > 1_000_000
      ):
          raise AssessmentError("Transitions must be a small file in the system temporary directory")
      data = json.loads(path.read_text(encoding="utf-8"))
      if not isinstance(data, list) or not all(isinstance(item, dict) for item in data):
          raise AssessmentError("Transitions must be a JSON array of objects")
      print(json.dumps(version_chain(start, target, data), indent=2))


  def finalize(evidence_path: Path, report_path: Path) -> None:
      evidence = load_evidence(evidence_path)
      assert_repository_unchanged(
          str(evidence["repository_head"]),
          str(evidence["repository_status_digest"]),
      )
      report = read_temporary_file(report_path, "Report draft", 2_000_000, Path("/opt/data"))
      validate_report(report, evidence)
      decisions = report_decisions(report, evidence)
      revalidate_remote_heads(evidence)
      assert_repository_unchanged(
          str(evidence["repository_head"]),
          str(evidence["repository_status_digest"]),
      )
      source = report_path.resolve(strict=True)
      os.replace(source, REPORT_FILE)
      REPORT_FILE.chmod(0o600)
      record_weekly_outcomes(decisions)


  def read_pr_files(number: int, expected_count: int) -> list[dict[str, object]]:
      pages = gh_json(
          [
              "api",
              "--paginate",
              "--slurp",
              f"repos/{TARGET_REPO}/pulls/{number}/files?per_page=100",
          ]
      )
      if not isinstance(pages, list) or not all(isinstance(page, list) for page in pages):
          raise AssessmentError(f"PR #{number} file list is unavailable")
      files = [item for page in pages for item in page]
      if not all(isinstance(item, dict) for item in files):
          raise AssessmentError(f"PR #{number} file list is invalid")
      if len(files) != expected_count:
          raise AssessmentError(f"PR #{number} file list is incomplete")
      return files


  def merge_exclusion(files: object) -> str | None:
      if not isinstance(files, list):
          return "PR file list is unavailable"
      for item in files:
          if not isinstance(item, dict):
              return "PR file list is invalid"
          for field in ("filename", "previous_filename", "path"):
              path = item.get(field)
              if isinstance(path, str) and path.startswith(MERGE_EXCLUDED_PATHS):
                  return f"excluded path: {path}"
      return None


  def checks_allow_merge(pull_request: dict[str, object]) -> bool:
      if pull_request.get("mergeStateStatus") != "CLEAN":
          return False
      checks = pull_request.get("statusCheckRollup")
      if not isinstance(checks, list) or not checks:
          return False
      for check in checks:
          if not isinstance(check, dict):
              return False
          if check.get("__typename") == "CheckRun":
              if check.get("status") != "COMPLETED" or check.get("conclusion") not in PASSING_CHECK_CONCLUSIONS:
                  return False
          elif check.get("__typename") == "StatusContext":
              if check.get("state") != "SUCCESS":
                  return False
          else:
              return False
      return True


  def merge_evidence_is_fresh(value: object, *, now: dt.datetime | None = None) -> bool:
      try:
          checked_at = dt.datetime.fromisoformat(str(value))
      except ValueError:
          return False
      if checked_at.tzinfo is None:
          return False
      age = (now or dt.datetime.now(dt.timezone.utc)) - checked_at
      return dt.timedelta(0) <= age <= MAX_MERGE_EVIDENCE_AGE


  def single_merge_pull_request(evidence: dict[str, object]) -> dict[str, object]:
      pull_requests = evidence.get("pull_requests")
      if (
          not isinstance(pull_requests, list)
          or len(pull_requests) != 1
          or not isinstance(pull_requests[0], dict)
      ):
          raise AssessmentError("Merge requests must contain exactly one PR")
      return pull_requests[0]


  def merge_pull_request(number: int, head_sha: str) -> str:
      payload = json.dumps({"sha": head_sha, "merge_method": "squash"}).encode()
      response = json.loads(
          run(
              [
                  *tool_command("gh"),
                  "api",
                  "--method",
                  "PUT",
                  f"repos/{TARGET_REPO}/pulls/{number}/merge",
                  "--input",
                  "-",
              ],
              input_bytes=payload,
          )
      )
      sha = response.get("sha") if isinstance(response, dict) else None
      if (
          not isinstance(response, dict)
          or response.get("merged") is not True
          or not isinstance(sha, str)
          or re.fullmatch(r"[0-9a-f]{40}", sha) is None
      ):
          raise AssessmentError(f"GitHub did not merge PR #{number}")
      return sha


  def load_pending_rollout(path: Path = ROLLOUT_STATE_FILE) -> dict[str, object] | None:
      if not path.exists():
          return None
      try:
          pending = json.loads(path.read_text(encoding="utf-8"))
      except (OSError, json.JSONDecodeError) as error:
          raise AssessmentError("Pending rollout state is invalid") from error
      if (
          not isinstance(pending, dict)
          or set(pending) != {
              "affected_kustomizations",
              "head_sha",
              "merge_sha",
              "merged_at",
              "number",
          }
          or not isinstance(pending.get("number"), int)
          or re.fullmatch(r"[0-9a-f]{40}", str(pending.get("head_sha", ""))) is None
          or (
              pending.get("merge_sha") is not None
              and re.fullmatch(r"[0-9a-f]{40}", str(pending["merge_sha"])) is None
          )
          or (
              pending.get("merged_at") is not None
              and parse_timestamp(pending.get("merged_at")) is None
          )
          or ((pending.get("merge_sha") is None) != (pending.get("merged_at") is None))
          or not valid_kustomization_refs(pending.get("affected_kustomizations"))
      ):
          raise AssessmentError("Pending rollout state is invalid")
      return pending


  def write_pending_rollout(
      number: int,
      head_sha: str,
      merge_sha: str | None,
      affected_kustomizations: list[dict[str, str]],
      merged_at: str | None,
      path: Path = ROLLOUT_STATE_FILE,
  ) -> None:
      temporary = path.with_suffix(".tmp")
      payload = {
          "affected_kustomizations": affected_kustomizations,
          "head_sha": head_sha,
          "merge_sha": merge_sha,
          "merged_at": merged_at,
          "number": number,
      }
      temporary.write_text(json.dumps(payload) + "\n", encoding="utf-8")
      temporary.chmod(0o600)
      os.replace(temporary, path)


  def kube_request(path: str) -> bytes:
      host = os.environ.get("KUBERNETES_SERVICE_HOST", "")
      port = os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS", "443")
      if not host or not port.isdigit():
          raise AssessmentError("Kubernetes API location is unavailable")
      try:
          token = KUBE_TOKEN_FILE.read_text(encoding="utf-8").strip()
          context = ssl.create_default_context(cafile=KUBE_CA_FILE)
          request = Request(
              f"https://{host}:{port}{path}",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urlopen(request, timeout=30, context=context) as response:
              return response.read()
      except (OSError, HTTPError, URLError, TimeoutError, json.JSONDecodeError) as error:
          raise AssessmentError("Kubernetes rollout verification failed safely") from error


  def kube_json(path: str) -> dict[str, object]:
      try:
          result = json.loads(kube_request(path))
      except (json.JSONDecodeError, UnicodeDecodeError) as error:
          raise AssessmentError("Kubernetes API returned invalid rollout data") from error
      if not isinstance(result, dict):
          raise AssessmentError("Kubernetes API returned invalid rollout data")
      return result


  def kube_text(path: str) -> str:
      try:
          return kube_request(path).decode("utf-8", errors="strict")
      except UnicodeDecodeError as error:
          raise AssessmentError("Kubernetes logs are invalid") from error


  def parse_timestamp(value: object) -> dt.datetime | None:
      if not isinstance(value, str):
          return None
      try:
          parsed = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
      except ValueError:
          return None
      return parsed if parsed.tzinfo is not None else None


  def valid_kustomization_refs(value: object) -> bool:
      return (
          isinstance(value, list)
          and bool(value)
          and all(
              isinstance(item, dict)
              and set(item) == {"name", "namespace"}
              and all(
                  isinstance(item.get(field), str)
                  and re.fullmatch(r"[a-z0-9](?:[-a-z0-9]*[a-z0-9])?", item[field])
                  for field in ("name", "namespace")
              )
              for item in value
          )
      )


  def affected_kustomizations(
      files: list[dict[str, object]],
      *,
      kube_reader=kube_json,
  ) -> list[dict[str, str]]:
      changed = {
          str(path)
          for item in files
          for path in (item.get("filename"), item.get("previous_filename"))
          if isinstance(path, str)
      }
      items = kube_reader("/apis/kustomize.toolkit.fluxcd.io/v1/kustomizations").get("items")
      if not isinstance(items, list):
          raise AssessmentError("Flux Kustomization list is invalid")
      affected: list[dict[str, str]] = []
      for item in items:
          if not isinstance(item, dict):
              raise AssessmentError("Flux Kustomization list entry is invalid")
          metadata = item.get("metadata")
          spec = item.get("spec")
          if not isinstance(metadata, dict) or not isinstance(spec, dict):
              raise AssessmentError("Flux Kustomization list entry is invalid")
          path = str(spec.get("path", "")).removeprefix("./").rstrip("/")
          owner = path.rsplit("/", 1)[0] if path.rsplit("/", 1)[-1] in {"app", "cluster", "models", "mcp"} else path
          if not any(
              filename == path
              or filename.startswith(path + "/")
              or filename == owner + "/ks.yaml"
              for filename in changed
          ):
              continue
          reference = {
              "name": str(metadata.get("name", "")),
              "namespace": str(metadata.get("namespace", "")),
          }
          affected.append(reference)
      affected.sort(key=lambda item: (item["namespace"], item["name"]))
      if not valid_kustomization_refs(affected):
          raise AssessmentError("Changed files do not map to affected Flux Kustomizations")
      return affected


  def resource_is_ready(resource: object) -> bool:
      if not isinstance(resource, dict):
          return False
      metadata = resource.get("metadata")
      status = resource.get("status")
      if not isinstance(metadata, dict) or not isinstance(status, dict):
          return False
      if status.get("observedGeneration") != metadata.get("generation"):
          return False
      conditions = status.get("conditions")
      return isinstance(conditions, list) and any(
          isinstance(condition, dict)
          and condition.get("type") == "Ready"
          and condition.get("status") == "True"
          for condition in conditions
      )


  def revision_contains_merge(
      revision: object,
      merge_sha: str,
      *,
      github_reader=gh_json,
  ) -> bool:
      match = REVISION.fullmatch(str(revision or ""))
      if match is None:
          return False
      comparison = github_reader(
          ["api", f"repos/{TARGET_REPO}/compare/{merge_sha}...{match.group(1)}"]
      )
      return isinstance(comparison, dict) and comparison.get("status") in {"ahead", "identical"}


  def inventory_entries(resource: dict[str, object]) -> list[tuple[str, str, str, str]]:
      status = resource.get("status")
      inventory = status.get("inventory") if isinstance(status, dict) else None
      entries = inventory.get("entries") if isinstance(inventory, dict) else None
      if not isinstance(entries, list):
          raise AssessmentError("Flux Kustomization inventory is unavailable")
      parsed: list[tuple[str, str, str, str]] = []
      for entry in entries:
          identifier = entry.get("id") if isinstance(entry, dict) else None
          parts = identifier.split("_", 3) if isinstance(identifier, str) else []
          if len(parts) != 4:
              raise AssessmentError("Flux Kustomization inventory is invalid")
          parsed.append(tuple(parts))
      return parsed


  def collection_items(value: object, label: str) -> list[dict[str, object]]:
      items = value.get("items") if isinstance(value, dict) else None
      if not isinstance(items, list) or not all(isinstance(item, dict) for item in items):
          raise AssessmentError(f"{label} list is invalid")
      return items


  def workload_is_healthy(resource: object) -> bool:
      if not isinstance(resource, dict):
          return False
      metadata = resource.get("metadata")
      spec = resource.get("spec")
      status = resource.get("status")
      if not all(isinstance(value, dict) for value in (metadata, spec, status)):
          return False
      if status.get("observedGeneration") != metadata.get("generation"):
          return False
      kind = resource.get("kind")
      if kind == "Deployment":
          desired = int(spec.get("replicas", 1))
          return all(int(status.get(field, 0)) == desired for field in ("availableReplicas", "readyReplicas", "updatedReplicas")) and int(status.get("unavailableReplicas", 0)) == 0
      if kind == "StatefulSet":
          desired = int(spec.get("replicas", 1))
          return all(int(status.get(field, 0)) == desired for field in ("currentReplicas", "readyReplicas", "updatedReplicas"))
      if kind == "DaemonSet":
          desired = int(status.get("desiredNumberScheduled", 0))
          return desired > 0 and all(int(status.get(field, 0)) == desired for field in ("numberAvailable", "numberReady", "updatedNumberScheduled")) and int(status.get("numberUnavailable", 0)) == 0
      return False


  def pod_is_healthy(pod: object) -> bool:
      if not isinstance(pod, dict):
          return False
      metadata = pod.get("metadata")
      status = pod.get("status")
      if not isinstance(metadata, dict) or not isinstance(status, dict):
          return False
      if metadata.get("deletionTimestamp") is not None:
          return False
      if status.get("phase") == "Succeeded":
          return True
      containers = status.get("containerStatuses")
      return (
          status.get("phase") == "Running"
          and isinstance(containers, list)
          and bool(containers)
          and all(
              isinstance(container, dict)
              and container.get("ready") is True
              and not (isinstance(container.get("state"), dict) and container["state"].get("waiting"))
              for container in containers
          )
      )


  def route_is_healthy(route: object) -> bool:
      if not isinstance(route, dict):
          return False
      metadata = route.get("metadata")
      status = route.get("status")
      parents = status.get("parents") if isinstance(status, dict) else None
      if not isinstance(metadata, dict) or not isinstance(parents, list) or not parents:
          return False
      for parent in parents:
          conditions = parent.get("conditions") if isinstance(parent, dict) else None
          if not isinstance(conditions, list):
              return False
          accepted = {
              condition.get("type"): condition
              for condition in conditions
              if isinstance(condition, dict) and condition.get("type") in {"Accepted", "ResolvedRefs"}
          }
          if any(
              accepted.get(kind, {}).get("status") != "True"
              or accepted.get(kind, {}).get("observedGeneration") != metadata.get("generation")
              for kind in ("Accepted", "ResolvedRefs")
          ):
              return False
      return True


  def verify_runtime_health(
      kustomization: dict[str, object],
      merged_at: str,
      *,
      kube_reader=kube_json,
      log_reader=kube_text,
  ) -> None:
      helm_releases: set[tuple[str, str]] = set()
      routes: set[tuple[str, str]] = set()
      for namespace, name, group, kind in inventory_entries(kustomization):
          if kind == "HelmRelease" and group == "helm.toolkit.fluxcd.io":
              helm_releases.add((namespace, name))
          elif kind == "HTTPRoute" and group == "gateway.networking.k8s.io":
              routes.add((namespace, name))
      for namespace, name in helm_releases:
          release = kube_reader(
              f"/apis/helm.toolkit.fluxcd.io/v2/namespaces/{quote(namespace)}/helmreleases/{quote(name)}"
          )
          if not resource_is_ready(release):
              raise AssessmentError(f"HelmRelease {namespace}/{name} is not healthy")
          selector = quote(f"app.kubernetes.io/instance={name}")
          workloads: list[dict[str, object]] = []
          for plural in ("deployments", "statefulsets", "daemonsets"):
              workloads.extend(
                  collection_items(
                      kube_reader(f"/apis/apps/v1/namespaces/{quote(namespace)}/{plural}?labelSelector={selector}"),
                      plural,
                  )
              )
          if not workloads or not all(workload_is_healthy(item) for item in workloads):
              raise AssessmentError(f"Workloads for {namespace}/{name} are not healthy")
          pods = collection_items(
              kube_reader(f"/api/v1/namespaces/{quote(namespace)}/pods?labelSelector={selector}"),
              "pods",
          )
          if not pods or not all(pod_is_healthy(pod) for pod in pods):
              raise AssessmentError(f"Pods for {namespace}/{name} are not healthy")
          for pod in pods:
              if pod.get("status", {}).get("phase") != "Running":
                  continue
              pod_name = quote(str(pod.get("metadata", {}).get("name", "")))
              containers = pod.get("spec", {}).get("containers")
              if not isinstance(containers, list):
                  raise AssessmentError("Pod container metadata is invalid")
              for container in containers:
                  container_name = quote(str(container.get("name", ""))) if isinstance(container, dict) else ""
                  logs = log_reader(
                      f"/api/v1/namespaces/{quote(namespace)}/pods/{pod_name}/log?container={container_name}&sinceTime={quote(merged_at)}&tailLines=200&timestamps=true"
                  )
                  if ERROR_LOG_MARKER.search(logs):
                      raise AssessmentError(f"Recent error logs found for {namespace}/{name}")
      for namespace, name in routes:
          route = kube_reader(
              f"/apis/gateway.networking.k8s.io/v1/namespaces/{quote(namespace)}/httproutes/{quote(name)}"
          )
          if not route_is_healthy(route):
              raise AssessmentError(f"HTTPRoute {namespace}/{name} is not healthy")


  def verify_rollout_gate(
      merge_sha: str,
      affected: list[dict[str, str]],
      merged_at: str,
      *,
      kube_reader=kube_json,
      github_reader=gh_json,
      log_reader=kube_text,
  ) -> None:
      source = kube_reader(
          "/apis/source.toolkit.fluxcd.io/v1/namespaces/flux-system/gitrepositories/flux-system"
      )
      if not resource_is_ready(source):
          raise AssessmentError("Flux GitRepository is not ready")
      source_status = source.get("status")
      artifact = source_status.get("artifact") if isinstance(source_status, dict) else None
      revision = artifact.get("revision") if isinstance(artifact, dict) else None
      if not revision_contains_merge(revision, merge_sha, github_reader=github_reader):
          raise AssessmentError("Flux has not observed the merged commit")
      for reference in affected:
          namespace = quote(reference["namespace"])
          name = quote(reference["name"])
          child = kube_reader(
              f"/apis/kustomize.toolkit.fluxcd.io/v1/namespaces/{namespace}/kustomizations/{name}"
          )
          if not resource_is_ready(child):
              raise AssessmentError(f"Flux Kustomization {reference['namespace']}/{reference['name']} is not healthy")
          status = child.get("status")
          child_revision = status.get("lastAppliedRevision") if isinstance(status, dict) else None
          if not revision_contains_merge(child_revision, merge_sha, github_reader=github_reader):
              raise AssessmentError(f"Flux Kustomization {reference['namespace']}/{reference['name']} has not applied the merge")
          verify_runtime_health(child, merged_at, kube_reader=kube_reader, log_reader=log_reader)


  def confirm_rollout_healthy(merge_sha: str) -> dict[str, object]:
      pending = load_pending_rollout()
      if pending is None or pending.get("merge_sha") != merge_sha:
          raise AssessmentError("Rollout confirmation does not match the pending merge")
      verify_rollout_gate(
          merge_sha,
          pending["affected_kustomizations"],
          str(pending["merged_at"]),
      )
      ROLLOUT_STATE_FILE.unlink()
      return {"merge_sha": merge_sha, "result": "healthy"}


  def merge_recommended(
      evidence_path: Path,
      *,
      report_path: Path = REPORT_FILE,
      enforce_repository: bool = True,
  ) -> list[dict[str, object]]:
      if load_pending_rollout() is not None:
          raise AssessmentError("Previous merge is waiting for conclusive rollout health")
      evidence = load_evidence(evidence_path)
      collected = single_merge_pull_request(evidence)
      if not merge_evidence_is_fresh(evidence.get("checked_at")):
          raise AssessmentError("Assessment evidence is not fresh enough to merge")
      if enforce_repository:
          assert_repository_unchanged(
              str(evidence["repository_head"]),
              str(evidence["repository_status_digest"]),
          )
      report = (
          report_path.read_bytes()
          if enforce_repository
          else read_temporary_file(report_path, "Merge report", 2_000_000, EXCHANGE_ROOT)
      )
      validate_report(report, evidence)
      revalidate_remote_heads(evidence)
      decisions = report_decisions(report, evidence)
      results: list[dict[str, object]] = []
      for collected in [collected]:
          number = int(collected["number"])
          recommendation = decisions[number]["recommendation"]
          if recommendation != "merge":
              results.append({"number": number, "result": "not-recommended", "recommendation": recommendation})
              continue
          current = read_pr(number)
          if (
              current.get("baseRefName") != "main"
              or current.get("baseRefOid") != collected["baseRefOid"]
              or current.get("headRefOid") != collected["headRefOid"]
          ):
              results.append({"number": number, "result": "blocked", "reason": "base or head changed"})
              continue
          if current.get("state") != "OPEN" or current.get("isDraft") is not False:
              results.append({"number": number, "result": "blocked", "reason": "PR is not open and ready"})
              continue
          if current.get("reviewDecision") not in (None, "", "APPROVED"):
              results.append({"number": number, "result": "blocked", "reason": "review decision is not approved"})
              continue
          files = read_pr_files(number, int(current["changedFiles"]))
          exclusion = merge_exclusion(files)
          if exclusion is not None:
              results.append({"number": number, "result": "excluded", "reason": exclusion})
              continue
          if not checks_allow_merge(current):
              results.append({"number": number, "result": "blocked", "reason": "checks or merge state are not clean"})
              continue
          head_sha = str(collected["headRefOid"])
          affected = affected_kustomizations(files)
          validate_merge_token(str(current["baseRefName"]))
          write_pending_rollout(number, head_sha, None, affected, None)
          merge_sha = merge_pull_request(number, head_sha)
          merged_at = dt.datetime.now(dt.timezone.utc).isoformat()
          write_pending_rollout(number, head_sha, merge_sha, affected, merged_at)
          results.append({"number": number, "result": "merged", "merge_sha": merge_sha})
      return results


  def request_merge(evidence_path: Path, report_path: Path, url: str) -> None:
      payload = json.dumps({"evidence": str(evidence_path), "report": str(report_path)}).encode()
      request = Request(url, data=payload, headers={"Content-Type": "application/json"}, method="POST")
      try:
          with urlopen(request, timeout=600) as response:
              result = json.loads(response.read())
      except (HTTPError, URLError, TimeoutError, ConnectionError) as error:
          raise AssessmentError("Merge broker request failed safely") from error
      if not isinstance(result, list):
          raise AssessmentError("Merge broker returned an invalid response")
      print(json.dumps(result, indent=2))


  def stage_broker_report(source: Path = REPORT_FILE) -> Path:
      report = source.read_bytes()
      descriptor, name = tempfile.mkstemp(
          prefix="assess-renovate-prs-report-",
          suffix=".md",
          dir=EXCHANGE_ROOT,
      )
      path = Path(name)
      try:
          with os.fdopen(descriptor, "wb") as handle:
              handle.write(report)
      except BaseException:
          path.unlink(missing_ok=True)
          raise
      return path


  def finalize_and_request_merge(evidence_path: Path, report_path: Path, url: str) -> None:
      finalize(evidence_path, report_path)
      broker_report = stage_broker_report()
      try:
          request_merge(evidence_path, broker_report, url)
      finally:
          broker_report.unlink(missing_ok=True)


  def request_rollout_confirmation(merge_sha: str, url: str) -> None:
      payload = json.dumps({"merge_sha": merge_sha, "status": "healthy"}).encode()
      request = Request(url, data=payload, headers={"Content-Type": "application/json"}, method="POST")
      try:
          with urlopen(request, timeout=120) as response:
              result = json.loads(response.read())
      except (HTTPError, URLError, TimeoutError, ConnectionError) as error:
          raise AssessmentError("Rollout-health confirmation failed safely") from error
      if not isinstance(result, dict) or result.get("result") != "healthy":
          raise AssessmentError("Merge broker did not accept rollout health")
      print(json.dumps(result, indent=2))


  def branch_protection_is_safe(protection: object) -> bool:
      if not isinstance(protection, dict):
          return False
      checks = protection.get("required_status_checks")
      admins = protection.get("enforce_admins")
      return (
          isinstance(checks, dict)
          and checks.get("strict") is True
          and isinstance(checks.get("checks"), list)
          and bool(checks["checks"])
          and isinstance(admins, dict)
          and admins.get("enabled") is True
      )


  def validate_merge_token(expected_branch: str = "main") -> None:
      repository = gh_json(["api", f"repos/{TARGET_REPO}"])
      if (
          not isinstance(repository, dict)
          or repository.get("full_name") != TARGET_REPO
          or repository.get("default_branch") != expected_branch
          or expected_branch != "main"
      ):
          raise AssessmentError("Merge broker token cannot read the target repository")
      protection = gh_json(
          ["api", f"repos/{TARGET_REPO}/branches/{quote(expected_branch)}/protection"]
      )
      if not branch_protection_is_safe(protection):
          raise AssessmentError("Main branch protection is not safe for automated merges")


  class MergeBrokerHandler(BaseHTTPRequestHandler):
      def send_json(self, status: int, value: object) -> None:
          body = json.dumps(value).encode()
          self.send_response(status)
          self.send_header("Content-Type", "application/json")
          self.send_header("Content-Length", str(len(body)))
          self.end_headers()
          self.wfile.write(body)

      def do_POST(self) -> None:
          if self.path not in {"/merge", "/rollout-health"}:
              self.send_json(404, {"error": "not found"})
              return
          try:
              length = int(self.headers.get("Content-Length", "0"))
              if length <= 0 or length > 4096:
                  raise AssessmentError("Invalid broker request size")
              request = json.loads(self.rfile.read(length))
              if self.path == "/merge":
                  if not isinstance(request, dict) or set(request) != {"evidence", "report"}:
                      raise AssessmentError("Invalid broker request")
                  evidence = request["evidence"]
                  report = request["report"]
                  if not isinstance(evidence, str) or not isinstance(report, str):
                      raise AssessmentError("Invalid broker file path")
                  result = merge_recommended(
                      Path(evidence),
                      report_path=Path(report),
                      enforce_repository=False,
                  )
              else:
                  if not isinstance(request, dict) or set(request) != {"merge_sha", "status"}:
                      raise AssessmentError("Invalid rollout-health request")
                  merge_sha = request["merge_sha"]
                  if (
                      not isinstance(merge_sha, str)
                      or re.fullmatch(r"[0-9a-f]{40}", merge_sha) is None
                      or request["status"] != "healthy"
                  ):
                      raise AssessmentError("Only conclusive healthy rollout confirmation is accepted")
                  result = confirm_rollout_healthy(merge_sha)
              self.send_json(200, result)
          except (AssessmentError, json.JSONDecodeError, UnicodeDecodeError, ValueError, OSError) as error:
              self.send_json(409, {"error": str(error)})

      def log_message(self, format: str, *args: object) -> None:
          return


  def serve(host: str, port: int) -> None:
      if host != "127.0.0.1" or not 1024 <= port <= 65535:
          raise AssessmentError("Merge broker must use a non-privileged loopback address")
      HTTPServer((host, port), MergeBrokerHandler).serve_forever()


  def cleanup(evidence_path: Path) -> None:
      evidence = load_evidence(evidence_path)
      remove_workspace(Path(str(evidence["workspace"])))
      evidence_path.unlink(missing_ok=True)


