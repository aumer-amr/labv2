---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  decryption:
    provider: sops
  deletionPolicy: WaitForTermination
  interval: 1h
  path: ./kubernetes/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  patches:
    - # Add Kustomization defaults for all child Kustomizations
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          decryption:
            provider: sops
          deletionPolicy: WaitForTermination
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  install:
                    crds: CreateReplace
                    strategy:
                      name: RetryOnFailure
                  rollback:
                    cleanupOnFail: true
                    recreate: true
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    # Hold Cilium and Spegel for per-node functional gates during task 90.
    - patch: |-
        - op: add
          path: /spec/patches/-
          value:
            patch: |-
              - op: add
                path: /spec/values/updateStrategy
                value:
                  type: OnDelete
                  rollingUpdate: null
              - op: add
                path: /spec/values/operator/rollOutPods
                value: false
              - op: add
                path: /spec/values/operator/podAnnotations
                value:
                  cilium.io/cilium-configmap-checksum: ac49d7803df8177d57fea227b69769b3f3dd1d15f35142d528967248baadda75
              - op: add
                path: /spec/upgrade/remediation/retries
                value: 0
              - op: add
                path: /spec/upgrade/remediation/remediateLastFailure
                value: false
              - op: add
                path: /spec/upgrade/cleanupOnFail
                value: false
              - op: add
                path: /spec/rollback/cleanupOnFail
                value: false
            target:
              group: helm.toolkit.fluxcd.io
              kind: HelmRelease
              name: cilium
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        namespace: kube-system
        name: cilium
    - patch: |-
        - op: add
          path: /spec/patches/-
          value:
            patch: |-
              - op: add
                path: /spec/values/updateStrategy
                value:
                  type: OnDelete
              - op: add
                path: /spec/upgrade/remediation/retries
                value: 0
              - op: add
                path: /spec/upgrade/remediation/remediateLastFailure
                value: false
              - op: add
                path: /spec/upgrade/cleanupOnFail
                value: false
              - op: add
                path: /spec/rollback/cleanupOnFail
                value: false
            target:
              group: helm.toolkit.fluxcd.io
              kind: HelmRelease
              name: spegel
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        namespace: kube-system
        name: spegel
