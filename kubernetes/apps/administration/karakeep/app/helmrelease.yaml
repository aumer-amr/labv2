---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  chartRef:
    kind: OCIRepository
    name: karakeep
  interval: 1h
  timeout: 10m
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      karakeep:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          migrate:
            image: &image
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
            # Run the upstream processes directly to avoid s6's root-owned /run.
            workingDir: /db_migrations
            command: [node, /db_migrations/index.js]
            env: &env
              DATA_DIR: /data
              NEXTAUTH_URL: https://karakeep.aumer.dev
              NEXTAUTH_URL_INTERNAL: http://127.0.0.1:3000
              MEILI_ADDR: http://127.0.0.1:7700
              BROWSER_WEB_URL: http://127.0.0.1:9222
              DISABLE_SIGNUPS: "true"
              TZ: Europe/Amsterdam
            envFrom: &envFrom
              - secretRef:
                  name: karakeep-secret
            securityContext: &security
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        containers:
          app:
            image: *image
            command: [node, /app/apps/web/server.js]
            env: *env
            envFrom: *envFrom
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  timeoutSeconds: 5
                  periodSeconds: 30
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *security
          workers:
            image: *image
            workingDir: /app/apps/workers
            command: [node, dist/index.js]
            env: *env
            envFrom: *envFrom
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *security
          chrome:
            image:
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: release@sha256:c51a8c8e6c3c1040a50fa0ecfd0b2fc298401b4229262636552458151f6f18fa
            args:
              - --disable-background-networking
              - --disable-quic
              - --disable-gpu
              - --disable-dev-shm-usage
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              <<: *security
              runAsUser: 65534
              runAsGroup: 65534
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.55.0
            env:
              MEILI_NO_ANALYTICS: "true"
              MEILI_ENV: production
              MEILI_UPGRADE_DB: "true"
              MEILI_DB_PATH: /data/meilisearch
              MEILI_DUMP_DIR: /data/meilisearch-dumps
              MEILI_SNAPSHOT_DIR: /data/meilisearch-snapshots
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: MEILI_MASTER_KEY
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 7700
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext: *security
    defaultPodOptions:
      automountServiceAccountToken: false
      labels:
        network.home.arpa/from-envoy-internal: allow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: karakeep
        ports:
          http:
            port: 3000
    persistence:
      data:
        existingClaim: karakeep
        advancedMounts:
          karakeep:
            migrate:
              - path: /data
            app:
              - path: /data
            workers:
              - path: /data
            meilisearch:
              - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
