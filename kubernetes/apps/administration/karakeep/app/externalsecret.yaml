---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: karakeep-secret
    template:
      data:
        NEXTAUTH_SECRET: "{{ .NEXTAUTH_SECRET }}"
        MEILI_MASTER_KEY: "{{ .MEILI_MASTER_KEY }}"
  dataFrom:
    - extract:
        key: karakeep
