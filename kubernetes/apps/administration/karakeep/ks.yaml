---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: karakeep
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: onepassword-connect
      namespace: external-secrets
    - name: kopiur
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/administration/karakeep/app
  postBuild:
    substitute:
      APP: karakeep
      NAMESPACE: administration
      KOPIUR_CAPACITY: 10Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: administration
