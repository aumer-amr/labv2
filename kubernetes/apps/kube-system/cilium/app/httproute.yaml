---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  annotations:
    gatus.home-operations.com/endpoint: |-
      path: /healthz
      conditions: ["[STATUS] == 200"]
spec:
  hostnames: ["hubble.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - name: health
      matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: hubble-ui
          port: 80
    - name: ui
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hubble-ui
          port: 80
