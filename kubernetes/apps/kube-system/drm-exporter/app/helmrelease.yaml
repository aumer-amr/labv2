---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drm-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: drm-exporter
  interval: 1h
  values:
    hostAccess:
      devDri: /dev/dri
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      serviceMonitor:
        enabled: true
    nodeSelector:
      kubernetes.io/arch: amd64
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
    securityContext:
      capabilities:
        add:
          - PERFMON
