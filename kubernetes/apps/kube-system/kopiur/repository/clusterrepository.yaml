---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: cloudflare
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kube-system
      bucket: kopiur
      endpoint: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
      region: WEUR
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kube-system
      key: KOPIA_PASSWORD
  scheduleDefaults:
    timezone: Europe/Amsterdam
  maintenance:
    schedule:
      quick:
        cron: "0 * * * *"
        jitter: 10m
      full:
        cron: "0 3 * * *"
        jitter: 1h
  parameters:
    epoch:
      minDuration: 3h
