---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kopia-verify-dns
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kopia-verify
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopia-verify
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kopia-verify
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchName: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
              - matchPattern: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com.*
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
              - matchPattern: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com.*
    - toFQDNs:
        - matchName: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
