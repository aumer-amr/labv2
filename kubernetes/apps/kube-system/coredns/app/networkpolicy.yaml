---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coredns
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ha-mcp
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: administration
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: kopiur
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cert-manager
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: cloudnative-pg
              app.kubernetes.io/name: cloudnative-pg
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
          podSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
          podSelector:
            matchLabels:
              app: onepassword-connect
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
          podSelector:
            matchLabels:
              app: source-controller
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: flux-operator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: konflate
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
          podSelector:
            matchLabels:
              app: helm-controller
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
          podSelector:
            matchLabels:
              app: kustomize-controller
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fitness
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sparkyfitness
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fitness
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: kopiur
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: home-assistant
              app.kubernetes.io/name: home-assistant
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: kopiur
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: Exists
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: kopiur
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: system-upgrade
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: tuppr
              app.kubernetes.io/name: tuppr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: system-upgrade
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tuppr
        - podSelector:
            matchLabels:
              k8s-app: hubble-relay
        - podSelector:
            matchLabels:
              k8s-app: hubble-ui
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/instance: kopiur
              app.kubernetes.io/name: kopiur
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: kopiur
              kopiur.home-operations.com/op: snapshot-delete-batch
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: maintenance
              app.kubernetes.io/managed-by: kopiur
              kopiur.home-operations.com/maintenance: cloudflare
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: ocharted
              app.kubernetes.io/name: ocharted
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: spegel
              app.kubernetes.io/instance: spegel
              app.kubernetes.io/name: spegel
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: cloudflare-tunnel
              app.kubernetes.io/name: cloudflare-tunnel
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: cloudflare-dns
              app.kubernetes.io/name: external-dns
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: k8s-gateway
              app.kubernetes.io/name: k8s-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gatus-sidecar
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana-operator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: grafana
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-logs-collector
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trivy-system
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: trivy-operator
              app.kubernetes.io/name: trivy-operator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trivy-system
          podSelector:
            matchLabels:
              network.home.arpa/trivy-scan: allow
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: kopiur
              kopiur.home-operations.com/cluster-repository: cloudflare
      ports:
        - port: 53
          protocol: UDP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: kopiur
              kopiur.home-operations.com/cluster-repository: cloudflare
      ports:
        - port: 53
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9153
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-upstreams
spec:
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
