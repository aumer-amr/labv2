---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coredns-whisper-assist
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: whisper-assist
      ports:
        - port: 53
          protocol: UDP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: whisper-assist
      ports:
        - port: 53
          protocol: TCP
