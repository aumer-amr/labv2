---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: crowdsec-secret
  data:
    - secretKey: BOUNCER_KEY_ENVOY
      remoteRef:
        key: crowdsec
        property: CROWDSEC_BOUNCER_KEY
    - secretKey: csLapiSecret
      remoteRef:
        key: crowdsec
        property: CROWDSEC_LAPI_SECRET
    - secretKey: registrationToken
      remoteRef:
        key: crowdsec
        property: CROWDSEC_REGISTRATION_TOKEN
