---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "aumer-dev-production"
spec:
  dnsNames:
    - "aumer.dev"
    - "*.aumer.dev"
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: "aumer-dev-production-tls"
  usages:
    - digital signature
