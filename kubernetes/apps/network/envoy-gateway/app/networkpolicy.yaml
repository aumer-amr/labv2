                protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-from-envoy-external
specs:
  - endpointSelector:
      matchLabels:
        k8s:io.kubernetes.pod.namespace: network
        gateway.envoyproxy.io/owning-gateway-name: envoy-external
    egress:
      - toEndpoints:
          - matchLabels:
              network.home.arpa/from-envoy-external: allow
        toPorts:
          # ponytail: opted-in backends allow Envoy to all TCP ports; use port-specific capabilities if port isolation becomes necessary.
          - ports:
              - port: "1"
                endPort: 65535
                protocol: TCP
  - endpointSelector:
      matchLabels:
        network.home.arpa/from-envoy-external: allow
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: network
              gateway.envoyproxy.io/owning-gateway-name: envoy-external
        toPorts:
          - ports:
              - port: "1"
                endPort: 65535
                protocol: TCP
