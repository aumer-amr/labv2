---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-gateway
spec:
  podSelector:
    matchLabels:
      control-plane: envoy-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 19001
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-external
      ports:
        - port: 18000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - port: 18000
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway-api
spec:
  endpointSelector:
    matchLabels:
      control-plane: envoy-gateway
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: idm.${SECRET_DOMAIN}
              - matchName: external.${SECRET_DOMAIN}
              - matchName: idm.${SECRET_DOMAIN}.network.svc.cluster.local
              - matchName: idm.${SECRET_DOMAIN}.svc.cluster.local
              - matchName: idm.${SECRET_DOMAIN}.cluster.local
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway-certgen-api
spec:
  endpointSelector:
    matchLabels:
      app: certgen
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-external-entrypoints
spec:
  endpointSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: envoy-external
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "10443"
              protocol: UDP
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "10443"
              protocol: UDP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-internal-entrypoints
spec:
  endpointSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: envoy-internal
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "10443"
              protocol: UDP
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "10443"
              protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-external
spec:
  podSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: envoy-external
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 19001
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              control-plane: envoy-gateway
      ports:
        - port: 18000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-to-envoy-external
specs:
  - endpointSelector:
      matchLabels:
        network.home.arpa/to-envoy-external: allow
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: network
              gateway.envoyproxy.io/owning-gateway-name: envoy-external
        toPorts:
          - ports:
              - port: "10443"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        k8s:io.kubernetes.pod.namespace: network
        gateway.envoyproxy.io/owning-gateway-name: envoy-external
    ingress:
      - fromEndpoints:
          - matchLabels:
              network.home.arpa/to-envoy-external: allow
        toPorts:
          - ports:
              - port: "10443"
                protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-to-envoy-internal
specs:
  - endpointSelector:
      matchLabels:
        network.home.arpa/to-envoy-internal: allow
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: network
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        toPorts:
          - ports:
              - port: "10443"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        k8s:io.kubernetes.pod.namespace: network
        gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    ingress:
      - fromEndpoints:
          - matchLabels:
