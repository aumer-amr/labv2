---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 1h
  upgrade:
    crds: CreateReplace
  values:
    global:
      imageRegistry: mirror.gcr.io
    config:
      envoyGateway:
        runtimeFlags:
          disabled:
            - OIDCTokenCookieChunking
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
