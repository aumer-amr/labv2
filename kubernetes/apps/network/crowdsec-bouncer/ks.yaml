---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec-bouncer
spec:
  dependsOn:
    - name: crowdsec
    - name: envoy-gateway
  interval: 1h
  path: ./kubernetes/apps/network/crowdsec-bouncer/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: false
