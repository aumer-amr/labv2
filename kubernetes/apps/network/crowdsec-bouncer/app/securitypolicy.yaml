---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: crowdsec-bouncer
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  extAuth:
    # Preserve gateway availability on bouncer transport failure; OIDC still applies.
    failOpen: true
    headersToExtAuth:
      # Forward only the chain Envoy appends, never caller-supplied IP overrides.
      - X-Forwarded-For
    grpc:
      backendRefs:
        - name: crowdsec-bouncer
          port: 8080
