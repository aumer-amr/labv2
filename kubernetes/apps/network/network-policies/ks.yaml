---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-policies
spec:
  dependsOn:
    - name: cloudflare-dns
    - name: cloudflare-tunnel
    - name: echo
    - name: envoy-gateway
    - name: k8s-gateway
    - name: unifi-dns
  interval: 1h
  path: ./kubernetes/apps/network/network-policies/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: true
