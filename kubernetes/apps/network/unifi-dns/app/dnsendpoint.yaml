---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: ddr-opt-out
spec:
  endpoints:
    # The local gateway name has no SVCB record, so clients keep using local DNS.
    - dnsName: _dns.resolver.arpa
      recordType: CNAME
      targets:
        - unifi
