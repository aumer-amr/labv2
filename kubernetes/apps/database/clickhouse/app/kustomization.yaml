---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/kopiur/backup
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  - name: clickhouse-backup
    files:
      - backup.xml=backup/backup.xml
      - backup.sh=backup/backup.sh
generatorOptions:
  disableNameSuffixHash: true
patches:
  - patch: |
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      metadata:
        name: ${APP}
      spec:
        mover:
          inheritSecurityContextFrom:
            snapshot: {}
        policy:
          onMissingSnapshot: Fail
  - patch: |
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotPolicy
      metadata:
        name: ${APP}
      spec:
        hooks:
          beforeSnapshot:
          - workloadExec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: clickhouse
              container: app
              command:
              - /bin/sh
              - /opt/backup/backup.sh
              timeout: 10m
