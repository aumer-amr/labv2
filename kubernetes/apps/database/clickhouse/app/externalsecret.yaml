---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-admin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: clickhouse-admin
  data:
    - secretKey: CLICKHOUSE_ADMIN_PASSWORD
      remoteRef:
        key: clickhouse
        property: CLICKHOUSE_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-users
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: clickhouse-users
    template:
      data:
        langfuse.xml: |
          <clickhouse>
            <users>
              <langfuse>
                <password_sha256_hex>{{ .CLICKHOUSE_PASSWORD | sha256sum }}</password_sha256_hex>
                <networks><ip>::/0</ip></networks>
                <profile>default</profile>
                <quota>default</quota>
                <grants>
                  <query>GRANT ALL ON default.*</query>
                  <query>GRANT SELECT ON system.parts</query>
                </grants>
              </langfuse>
            </users>
          </clickhouse>
  data:
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: langfuse
        property: CLICKHOUSE_PASSWORD
