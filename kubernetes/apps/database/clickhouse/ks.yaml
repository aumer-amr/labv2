---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clickhouse
spec:
  dependsOn:
    - name: network-policies
      namespace: database
    - name: onepassword-connect
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur
      namespace: kube-system
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/database/clickhouse/app
  postBuild:
    substitute:
      APP: clickhouse
      NAMESPACE: database
      KOPIUR_CAPACITY: 20Gi
      KOPIUR_PUID: "101"
      KOPIUR_PGID: "101"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
