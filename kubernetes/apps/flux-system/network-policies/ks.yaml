---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-policies
spec:
  dependsOn:
    - name: flux-instance
    - name: konflate
  interval: 1h
  path: ./kubernetes/apps/flux-system/network-policies/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  wait: true
