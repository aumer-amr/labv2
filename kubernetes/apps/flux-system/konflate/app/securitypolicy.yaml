---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: konflate-oidc
spec:
  # Keep route authentication/authorization while inheriting gateway CrowdSec checks.
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: konflate
      sectionName: ui
  oidc:
    provider:
      issuer: https://idm.aumer.dev/oauth2/openid/konflate
      authorizationEndpoint: https://idm.aumer.dev/ui/oauth2
      tokenEndpoint: https://idm.aumer.dev/oauth2/token
      backendRefs:
        - name: kanidm
          namespace: security
          port: 8443
    clientID: konflate
    clientSecret:
      name: konflate-secret
    redirectURL: https://konflate.aumer.dev/oauth2/callback
    logoutPath: /logout
    scopes: [openid]
