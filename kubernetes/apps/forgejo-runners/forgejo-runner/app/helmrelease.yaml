---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 1h
  values:
    configMaps:
      config:
        data:
          runner.yaml: |-
            log:
              level: info
            runner:
              capacity: 1
              timeout: 15m
              shutdown_timeout: 3m
              labels:
                - labv2-mirror:k8s:///config/podspec.yaml
            cache:
              enabled: false
            container:
              docker_host: "-"
              workdir_parent: shared/workdir
            host:
              workdir_parent: /data/act
            plugins:
              k8s:
                address: unix:///plugin/forgejo-runner-k8s.sock
                options:
                  namespace: forgejo-runners
                  poll_timeout: 5m
                  resources: |
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      memory: 1Gi
          podspec.yaml: |-
            automountServiceAccountToken: false
            runtimeClassName: gvisor
            dnsConfig:
              options:
                - name: ndots
                  value: "1"
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              runAsGroup: 1001
              fsGroup: 1001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: main
                image: ghcr.io/home-operations/actions-runner:2.338.2@sha256:2dd7caa094a425c041539447cb0e6ae63cda10b5242773764683b695b8fa5613
                env:
                  - name: PATH
                    value: /home/runner/externals/node24/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: [ALL]
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    memory: 1Gi
            restartPolicy: Never
    controllers:
      forgejo-runner:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: forgejo-runner
        pod:
          automountServiceAccountToken: true
          terminationGracePeriodSeconds: 300
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          k8s-plugin:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
              tag: 13.2.1@sha256:d62811841a20fd1a311b2c90c6ffcec37d09e52ebb46834b0c04f3ad2a3bcbe7
            args: [--listen, unix:///plugin/forgejo-runner-k8s.sock]
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          runner:
            image:
              repository: data.forgejo.org/forgejo/runner
              tag: 13.2.1@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d
            command:
              - sh
              - -ec
              - |
                exec /bin/forgejo-runner daemon \
                  --config /config/runner.yaml \
                  --url http://forgejo-http.developer-tools.svc.cluster.local:3000 \
                  --uuid "$(cat /etc/forgejo-runner-secret/uuid)" \
                  --token-url file:///etc/forgejo-runner-secret/token
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      plugin:
        type: emptyDir
        globalMounts:
          - path: /plugin
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      runner-secret:
        type: secret
        name: forgejo-runner-secret
        advancedMounts:
          forgejo-runner:
            runner:
              - path: /etc/forgejo-runner-secret
                readOnly: true
    serviceAccount:
      forgejo-runner: {}
    rbac:
      roles:
        forgejo-runner:
          type: Role
          rules:
            - apiGroups: [batch]
              resources: [jobs]
              verbs: [create, get, list, watch, delete]
            - apiGroups: [""]
              resources: [pods]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [pods/exec]
              verbs: [create, get]
            - apiGroups: [""]
              resources: [pods/log]
              verbs: [get, list, watch]
      bindings:
        forgejo-runner:
          type: RoleBinding
          roleRef:
            identifier: forgejo-runner
          subjects:
            - identifier: forgejo-runner
