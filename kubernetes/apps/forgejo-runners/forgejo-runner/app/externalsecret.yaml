---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-runner-secret
  data:
    - secretKey: uuid
      remoteRef:
        key: forgejo
        property: RUNNER_UUID
    - secretKey: token
      remoteRef:
        key: forgejo
        property: RUNNER_TOKEN
