---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
spec:
  chartRef:
    kind: OCIRepository
    name: vikunja
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      vikunja:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/vikunja/vikunja
              tag: 2.7.1@sha256:f7dc8428d10aef17f3075886d3c1c022f566ec456f88985f02c137f4fc534576
            env:
              TZ: Europe/Amsterdam
              VIKUNJA_DATABASE_TYPE: sqlite
              VIKUNJA_DATABASE_PATH: /data/vikunja.db
              VIKUNJA_FILES_BASEPATH: /data/files
              VIKUNJA_FILES_MAXSIZE: 10MB
              VIKUNJA_SERVICE_PUBLICURL: https://vikunja.aumer.dev
              VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
              VIKUNJA_SERVICE_ENABLELINKSHARING: "false"
              VIKUNJA_SERVICE_ENABLEPUBLICTEAMS: "false"
              VIKUNJA_SERVICE_ENABLEEMAILREMINDERS: "false"
              VIKUNJA_DEFAULTSETTINGS_AVATAR_PROVIDER: initials
              VIKUNJA_BACKGROUNDS_ENABLED: "false"
              VIKUNJA_MAILER_ENABLED: "false"
              VIKUNJA_WEBHOOKS_ENABLED: "false"
              VIKUNJA_SERVICE_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: vikunja-secret
                    key: VIKUNJA_SERVICE_SECRET
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/health
                    port: &port 3456
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      labels:
        network.home.arpa/from-envoy-internal: allow
        network.home.arpa/to-envoy-external: allow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: vikunja
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: vikunja
        globalMounts:
          - path: /data
      config:
        type: secret
        name: vikunja-secret
        defaultMode: 0440
        globalMounts:
          - path: /etc/vikunja/config.yml
            subPath: config.yml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
