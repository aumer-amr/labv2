---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vikunja-secret
    template:
      data:
        VIKUNJA_SERVICE_SECRET: "{{ .SERVICE_SECRET }}"
        config.yml: |-
          auth:
            local:
              enabled: false
            openid:
              enabled: true
              providers:
                kanidm:
                  name: Kanidm
                  authurl: https://idm.${SECRET_DOMAIN}/oauth2/openid/vikunja
                  clientid: vikunja
                  clientsecret: {{ .KANIDM_CLIENT_SECRET | toJson }}
                  scope: openid profile email
                  requireavailability: true
  data:
    - secretKey: SERVICE_SECRET
      remoteRef:
        key: vikunja
        property: SERVICE_SECRET
    - secretKey: KANIDM_CLIENT_SECRET
      remoteRef:
        key: vikunja
        property: KANIDM_CLIENT_SECRET
