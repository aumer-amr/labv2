---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vikunja
  annotations:
    gatus.home-operations.com/endpoint: |-
      path: /api/v2/health
      conditions: ["[STATUS] == 200", "[BODY].status == OK"]
spec:
  hostnames:
    - vikunja.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: vikunja
          port: 3456
