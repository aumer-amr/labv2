---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vikunja
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: coredns
      namespace: kube-system
    - name: envoy-gateway
      namespace: network
    - name: kanidm
      namespace: security
    - name: onepassword-connect
      namespace: external-secrets
    - name: kopiur
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  patches:
    - target:
        kind: SnapshotPolicy
        name: vikunja
      patch: |-
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: vikunja
        spec:
          retention:
            keepDaily: 30
  path: ./kubernetes/apps/developer-tools/vikunja/app
  postBuild:
    substitute:
      APP: vikunja
      KOPIUR_CAPACITY: 5Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: developer-tools
  wait: true
