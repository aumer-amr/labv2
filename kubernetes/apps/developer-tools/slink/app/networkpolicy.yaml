---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slink
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: slink
      app.kubernetes.io/name: slink
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchExpressions:
              - key: gateway.envoyproxy.io/owning-gateway-name
                operator: In
                values: [envoy-internal, envoy-external]
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: slink-r2
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: slink
      app.kubernetes.io/name: slink
  egress:
    - toEndpoints: &dns
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              # musl also searches these literal suffixes after an AAAA lookup returns no data.
              - matchName: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
              - matchName: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com.developer-tools.svc.cluster.local
              - matchName: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com.svc.cluster.local
              - matchName: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com.cluster.local
              - matchName: idm.aumer.dev
              - matchName: idm.aumer.dev.developer-tools.svc.cluster.local
              - matchName: idm.aumer.dev.svc.cluster.local
              - matchName: idm.aumer.dev.cluster.local
    - toEndpoints: *dns
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
              - matchName: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com.developer-tools.svc.cluster.local
              - matchName: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com.svc.cluster.local
              - matchName: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com.cluster.local
              - matchName: idm.aumer.dev
              - matchName: idm.aumer.dev.developer-tools.svc.cluster.local
              - matchName: idm.aumer.dev.svc.cluster.local
              - matchName: idm.aumer.dev.cluster.local
    - toFQDNs:
        - matchName: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: idm.aumer.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-from-envoy-slink
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: network
    matchExpressions:
      - key: gateway.envoyproxy.io/owning-gateway-name
        operator: In
        values: [envoy-internal, envoy-external]
  egress:
    - toServices:
        - k8sService:
            serviceName: slink
            namespace: developer-tools
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: slink-dns
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
      k8s:k8s-app: kube-dns
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: developer-tools
            app.kubernetes.io/instance: slink
            app.kubernetes.io/name: slink
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: developer-tools
            app.kubernetes.io/instance: slink
            app.kubernetes.io/name: slink
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
