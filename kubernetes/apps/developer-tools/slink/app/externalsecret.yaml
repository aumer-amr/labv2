---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slink
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: slink-secret
  data:
    - secretKey: AMAZON_S3_ACCESS_KEY_ID
      remoteRef:
        key: slink
        property: R2_ACCESS_KEY_ID
    - secretKey: AMAZON_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: slink
        property: R2_SECRET_ACCESS_KEY
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: slink
        property: ADMIN_EMAIL
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: slink
        property: ADMIN_PASSWORD
    - secretKey: KANIDM_CLIENT_SECRET
      remoteRef:
        key: slink
        property: KANIDM_CLIENT_SECRET
