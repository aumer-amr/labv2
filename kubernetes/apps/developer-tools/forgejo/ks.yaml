---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: coredns
      namespace: kube-system
    - name: envoy-gateway
      namespace: network
    - name: kanidm
      namespace: security
    - name: onepassword-connect
      namespace: external-secrets
    - name: kopiur
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/developer-tools/forgejo/app
  postBuild:
    substitute:
      APP: forgejo
      KOPIUR_CAPACITY: 10Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: developer-tools
  wait: true
