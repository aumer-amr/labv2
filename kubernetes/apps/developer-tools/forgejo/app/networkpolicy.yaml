---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/instance: forgejo
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo-mirror-check
      ports:
        - port: 3000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - port: 3000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo-runners
          podSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo-runner
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo-runners
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: forgejo-runner
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-external
      ports:
        - port: 10443
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-external
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/instance: forgejo
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchName: github.com
              - matchName: api.github.com
              - matchName: idm.aumer.dev
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: github.com
              - matchName: api.github.com
              - matchName: idm.aumer.dev
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: idm.aumer.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo-mirror-check
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo-mirror-check
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo
              app.kubernetes.io/instance: forgejo
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-mirror-check-dns
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo-mirror-check
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchName: forgejo-http.developer-tools.svc.cluster.local
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: forgejo-http.developer-tools.svc.cluster.local
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: forgejo-dns
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
      k8s:k8s-app: kube-dns
  ingress:
    - fromEndpoints:
        - matchLabels: &id001
            k8s:io.kubernetes.pod.namespace: developer-tools
            app.kubernetes.io/name: forgejo
            app.kubernetes.io/instance: forgejo
        - matchLabels: &id002
            k8s:io.kubernetes.pod.namespace: developer-tools
            app.kubernetes.io/name: forgejo-mirror-check
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    - fromEndpoints:
        - matchLabels: *id001
        - matchLabels: *id002
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-from-envoy-forgejo
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: network
      gateway.envoyproxy.io/owning-gateway-name: envoy-internal
  egress:
    - toServices:
        - k8sService:
            serviceName: forgejo-http
            namespace: developer-tools
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
