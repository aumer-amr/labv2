---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-mirror-check
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-mirror-check
  data:
    - secretKey: token
      remoteRef:
        key: forgejo
        property: MIRROR_READ_TOKEN
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-mirror-check
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: forgejo-mirror-check
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          containers:
            - name: check
              image: docker.io/python:3.15.2-slim@sha256:63bb298d2b7b88f176f51b5189f54ce6535c997682ea70885d2132f5d473a8a5
              command: [python3, /scripts/check.py]
              env:
                - name: FORGEJO_REPOSITORY
                  value: aumer/labv2
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: forgejo-mirror-check
            - name: credentials
              secret:
                secretName: forgejo-mirror-check
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forgejo-mirror
spec:
  groups:
    - name: forgejo-mirror
      rules:
        - alert: ForgejoMirrorCheckStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{namespace="developer-tools",cronjob="forgejo-mirror-check"} > 1800)
            or
            (kube_cronjob_info{namespace="developer-tools",cronjob="forgejo-mirror-check"}
             unless on(namespace,cronjob) kube_cronjob_status_last_successful_time{namespace="developer-tools",cronjob="forgejo-mirror-check"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Forgejo mirror monitoring has no recent success
            description: The LabV2 mirror check has no successful run within 30 minutes. Inspect mirror synchronization, the read token, and the CronJob.
