---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oauth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-oauth
    template:
      data:
        key: forgejo
        secret: "{{ .KANIDM_CLIENT_SECRET }}"
  data:
    - secretKey: KANIDM_CLIENT_SECRET
      remoteRef:
        key: forgejo
        property: KANIDM_CLIENT_SECRET
