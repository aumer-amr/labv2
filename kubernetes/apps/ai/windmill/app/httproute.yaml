---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: windmill
  annotations:
    gatus.home-operations.com/endpoint: |-
      path: /api/health/status
      conditions: ["[STATUS] == 200", "[BODY].status == healthy"]
spec:
  hostnames:
    - windmill.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: windmill-app
          port: 8000
