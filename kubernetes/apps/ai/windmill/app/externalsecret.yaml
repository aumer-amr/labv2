---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: windmill-secret
    template:
      data:
        SUPERADMIN_SECRET: "{{ .SUPERADMIN_SECRET }}"
        ADMIN_EMAIL: "{{ .ADMIN_EMAIL }}"
        ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        HERMES_API_KEY: "{{ .HERMES_API_KEY }}"
        url: postgresql://windmill:{{ .POSTGRES_PASSWORD | urlquery | replace "+" "%20" }}@windmill-rw.ai.svc.cluster.local:5432/windmill?sslmode=require
  dataFrom:
    - extract:
        key: windmill
