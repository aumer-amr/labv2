---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: windmill-bootstrap
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: windmill-bootstrap
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: bootstrap
              image: docker.io/python:3.15.2-slim@sha256:c4158543ecb725b99e57d129dfd43d761d4c43e4577b5e23326aabb223cf7f4e
              command:
                - python
                - -I
                - /workflow/bootstrap.py
              env:
                - name: SUPERADMIN_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: windmill-secret
                      key: SUPERADMIN_SECRET
                - name: ADMIN_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: windmill-secret
                      key: ADMIN_EMAIL
                - name: ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: windmill-secret
                      key: ADMIN_PASSWORD
                - name: CLOUDFLARE_WAF_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: windmill-cloudflare-secret
                      key: token
                      optional: true
                - name: GITHUB_HOOKS_LITELLM_KEY
                  valueFrom:
                    secretKeyRef:
                      name: windmill-github-hooks-litellm
                      key: key
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: workflow
                  mountPath: /workflow
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: workflow
              configMap:
                name: windmill-monitor
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: windmill-bootstrap-initial
  annotations:
    # Rerun the idempotent initializer when its immutable pod template changes.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windmill-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/python:3.15.2-slim@sha256:c4158543ecb725b99e57d129dfd43d761d4c43e4577b5e23326aabb223cf7f4e
          command:
            - python
            - -I
            - /workflow/bootstrap.py
          env:
            - name: SUPERADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: windmill-secret
                  key: SUPERADMIN_SECRET
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: windmill-secret
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windmill-secret
                  key: ADMIN_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: workflow
              mountPath: /workflow
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workflow
          configMap:
            name: windmill-monitor
        - name: tmp
          emptyDir: {}
