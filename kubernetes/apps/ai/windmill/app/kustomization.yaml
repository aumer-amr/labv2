---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/cnpg
resources:
  - ./externalsecret.yaml
  - ./github-hooks-config.sops.yaml
  - ./litellmvirtualkey.sops.yaml
patches:
  - patch: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: ${APP}
      spec:
        bootstrap:
          initdb:
            postInitApplicationSQL:
            - GRANT USAGE ON SCHEMA public TO windmill_user, windmill_admin
            - ALTER DEFAULT PRIVILEGES FOR ROLE windmill IN SCHEMA public GRANT ALL ON TABLES
              TO windmill_user
            - ALTER DEFAULT PRIVILEGES FOR ROLE windmill IN SCHEMA public GRANT ALL ON SEQUENCES
              TO windmill_user
            postInitSQL:
            - CREATE ROLE windmill_user
            - CREATE ROLE windmill_admin WITH BYPASSRLS
            - GRANT windmill_user TO windmill_admin
  - patch: |
      apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      metadata:
        name: ${APP}
      spec:
        inRoles:
          - windmill_admin
  - target:
      kind: Cluster
      name: \$\{APP\}
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          cnpg.io/hibernation: "on"
  - target:
      kind: ScheduledBackup
      name: \$\{APP\}
    patch: |
      - op: add
        path: /spec/suspend
        value: true
