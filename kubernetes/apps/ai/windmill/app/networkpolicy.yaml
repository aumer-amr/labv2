---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: windmill-app
spec:
  podSelector:
    matchLabels:
      app: windmill-app
      release: windmill
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
        - podSelector:
            matchLabels:
              release: windmill
              app: windmill-workers
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: windmill-bootstrap
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: windmill-worker
spec:
  podSelector:
    matchLabels:
      release: windmill
      app: windmill-workers
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: windmill-app
              release: windmill
      ports:
        - port: 8000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-monitor
      ports:
        - port: 8642
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: langfuse
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 9090
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: windmill-bootstrap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: windmill-bootstrap
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: windmill-app
              release: windmill
      ports:
        - port: 8000
          protocol: TCP
