---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: windmill
spec:
  dependsOn:
    - name: kube-prometheus-stack
      namespace: observability
    - name: cloudnative-pg
      namespace: database
    - name: barman-cloud
      namespace: database
    - name: postgresql-images
      namespace: database
    - name: onepassword-connect
      namespace: external-secrets
    - name: envoy-gateway
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: langfuse
      namespace: ai
    - name: hermes-monitor
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/windmill/app
  postBuild:
    substitute:
      APP: windmill
      NAMESPACE: ai
      PG_BACKUP_BUCKET: pg-windmill
      PG_MAJOR: "18"
      PG_SSLMODE: require
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: true
