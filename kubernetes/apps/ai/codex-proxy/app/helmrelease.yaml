---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: codex-proxy
spec:
  chartRef:
    kind: OCIRepository
    name: codex-proxy
  interval: 1h
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          codex-proxy:
            image:
              repository: ghcr.io/aumer-amr/codex-proxy
              tag: sha-37e7c54@sha256:306c66768c10585485c5f0a6d430820954b84ec8c44c998ed49ad36c289d0c5b
            env:
              CODEX_PROXY_DEFAULT_MODEL: gpt-6.1-sol
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 3466
                  periodSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      credentials:
        existingClaim: codex-proxy
        globalMounts:
          - path: /home/node/.codex
      tmp:
        type: emptyDir
