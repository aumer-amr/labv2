---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codex-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: codex-proxy
      app.kubernetes.io/name: codex-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: litellm
              app.kubernetes.io/name: litellm
      ports:
        - port: 3466
          protocol: TCP
  # Full egress is intentional for Codex authentication and model requests.
  egress:
    - {}
