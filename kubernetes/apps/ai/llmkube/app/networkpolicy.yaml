---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llmkube-controller-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: llmkube
      app.kubernetes.io/name: llmkube
      control-plane: controller-manager
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchName: huggingface.co
              - matchName: huggingface.co.ai.svc.cluster.local
              - matchName: huggingface.co.svc.cluster.local
              - matchName: huggingface.co.cluster.local
              - matchPattern: "**.hf.co"
              - matchPattern: "**.hf.co.ai.svc.cluster.local"
              - matchPattern: "**.hf.co.svc.cluster.local"
              - matchPattern: "**.hf.co.cluster.local"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: huggingface.co
              - matchName: huggingface.co.ai.svc.cluster.local
              - matchName: huggingface.co.svc.cluster.local
              - matchName: huggingface.co.cluster.local
              - matchPattern: "**.hf.co"
              - matchPattern: "**.hf.co.ai.svc.cluster.local"
              - matchPattern: "**.hf.co.svc.cluster.local"
              - matchPattern: "**.hf.co.cluster.local"
    - toFQDNs:
        - matchName: huggingface.co
        - matchName: huggingface.co.ai.svc.cluster.local
        - matchName: huggingface.co.svc.cluster.local
        - matchName: huggingface.co.cluster.local
        - matchPattern: "**.hf.co"
        - matchPattern: "**.hf.co.ai.svc.cluster.local"
        - matchPattern: "**.hf.co.svc.cluster.local"
        - matchPattern: "**.hf.co.cluster.local"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llmkube-controller-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: llmkube
      app.kubernetes.io/name: llmkube
      control-plane: controller-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llmkube-models
spec:
  podSelector:
    matchExpressions:
      - key: inference.llmkube.dev/service
        operator: In
        values:
          - qwen3-embedding-0.6b
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qwen3-reranker
spec:
  podSelector:
    matchLabels:
      inference.llmkube.dev/service: qwen3-reranker-0.6b
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini
              app.kubernetes.io/name: memini
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
---
