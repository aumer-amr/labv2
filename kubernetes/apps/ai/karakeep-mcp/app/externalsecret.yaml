---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: karakeep-mcp-secret
    template:
      data:
        KARAKEEP_API_KEY: "{{ .KARAKEEP_API_KEY }}"
  dataFrom:
    - extract:
        key: karakeep
