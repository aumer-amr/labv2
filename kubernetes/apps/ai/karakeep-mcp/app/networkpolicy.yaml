---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: karakeep-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: karakeep-mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: administration
          podSelector:
            matchLabels:
              app.kubernetes.io/name: karakeep
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: karakeep-mcp-registry
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: karakeep-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchName: registry.npmjs.org
              - matchName: karakeep.administration.svc.cluster.local
        - ports:
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: registry.npmjs.org
              - matchName: karakeep.administration.svc.cluster.local
    - toFQDNs:
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
