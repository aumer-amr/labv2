---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./mcpserver.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  - name: actual-mcp
    files:
      - server.mjs
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
