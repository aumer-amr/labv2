---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: actual-mcp-secret
    template:
      data:
        ACTUAL_SESSION_TOKEN: "{{ .ACTUAL_SESSION_TOKEN }}"
        ACTUAL_MCP_TOKEN: "{{ .ACTUAL_MCP_TOKEN }}"
        ACTUAL_ENCRYPTION_PASSWORDS: '{{ index . "ACTUAL_ENCRYPTION_PASSWORDS" | default "{}" }}'
  dataFrom:
    - extract:
        key: actual
