---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: actual-mcp
spec:
  alias: actual
  params:
    allow_all_keys: false
    allowed_tools:
      - list_budgets
      - list_accounts
      - get_budget_month
      - get_transactions
      - get_category_balance
      - get_budget_summary
      - get_categories
      - get_payees
      - budget_vs_actual
      - spending_projection
      - category_trends
      - spending_by_category
      - monthly_summary
      - balance_history
      - reconcile_account
      - get_rules
  proxyRef: litellm
  transport: http
  authType: bearer_token
  authTokenRef:
    name: actual-mcp-secret
    key: ACTUAL_MCP_TOKEN
  workload:
    automountServiceAccountToken: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    # renovate: datasource=docker depName=ghcr.io/henfrydls/actual-budget-mcp
    image: ghcr.io/henfrydls/actual-budget-mcp:0.11.0@sha256:3387bd8e7a0e620d20801536435e5c54aa80a5e8d5872f49596febd6b0c34c42
    port: 8080
    env:
      - name: ACTUAL_SESSION_TOKEN
        valueFrom:
          secretKeyRef:
            name: actual-mcp-secret
            key: ACTUAL_SESSION_TOKEN
      - name: ACTUAL_MCP_TOKEN
        valueFrom:
          secretKeyRef:
            name: actual-mcp-secret
            key: ACTUAL_MCP_TOKEN
      - name: ACTUAL_ENCRYPTION_PASSWORDS
        valueFrom:
          secretKeyRef:
            name: actual-mcp-secret
            key: ACTUAL_ENCRYPTION_PASSWORDS
      - name: ACTUAL_SERVER_URL
        value: http://actual.administration.svc.cluster.local.:5006
      - name: ACTUAL_READ_ONLY
        # The bridge forces read-only mode on /mcp and enables writes only on /mcp-write.
        value: "0"
      - name: ACTUAL_DATA_DIR
        value: /data
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 1Gi
    command:
      - node
      # Keep ESM imports relative to the ConfigMap mount, not its backing directory.
      - --preserve-symlinks-main
      - /app/bridge/server.mjs
    volumes:
      - name: bridge
        configMap:
          name: actual-mcp
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: bridge
        mountPath: /app/bridge
        readOnly: true
      - name: data
        mountPath: /data
      - name: tmp
        mountPath: /tmp
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: actual-mcp-write
spec:
  alias: actual_write
  params:
    # Grant only through the codex toolset; the actual registration stays read-only.
    allow_all_keys: false
    allowed_tools:
      - repair_sync
      - create_transaction
      - create_transactions
      - create_split_transaction
      - reconcile_currency_residual
      - update_budget_amount
      - transfer_between_categories
      - recategorize_transaction
      - create_transfer
      - update_transaction
      - delete_transaction
      - run_bank_sync
      - create_account
      - delete_account
      - update_account
      - create_category
      - update_category
      - delete_category
      - create_category_group
      - update_category_group
      - delete_category_group
      - create_payee
      - update_payee
      - delete_payee
      - create_rule
      - delete_rule
  proxyRef: litellm
  transport: http
  url: http://actual-mcp.ai.svc.cluster.local:8080/mcp-write
  authType: bearer_token
  authTokenRef:
    name: actual-mcp-secret
    key: ACTUAL_MCP_TOKEN
