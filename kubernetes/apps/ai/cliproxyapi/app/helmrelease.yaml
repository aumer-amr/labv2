---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cliproxyapi
spec:
  chartRef:
    kind: OCIRepository
    name: cliproxyapi
  interval: 1h
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          cliproxyapi:
            image:
              repository: docker.io/eceasy/cli-proxy-api
              tag: v8.1.6@sha256:e64b3e9814f3a263c3cd4b659c34a419a935e29ed60077a5739880c217292f34
            command: [/CLIProxyAPI/CLIProxyAPI]
            args: [--config, /etc/cliproxyapi/config.yaml, --local-model]
            env:
              HOME: /tmp
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 3466
                  periodSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      credentials:
        existingClaim: cliproxyapi
        globalMounts:
          - path: /var/lib/cliproxyapi/auth
      config:
        type: configMap
        name: cliproxyapi-config
        globalMounts:
          - path: /etc/cliproxyapi
            readOnly: true
      tmp:
        type: emptyDir
