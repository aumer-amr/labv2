---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-mcp
spec:
  dependsOn:
    - name: litellm-operator
      namespace: ai
    - name: onepassword-connect
      namespace: external-secrets
    - name: forgejo
      namespace: developer-tools
  interval: 1h
  path: ./kubernetes/apps/ai/forgejo-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: true
