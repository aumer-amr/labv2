---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-mcp-secret
  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: forgejo
        property: MCP_READ_TOKEN
