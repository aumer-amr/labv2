---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: piper
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: piper
      app.kubernetes.io/name: piper
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: open-webui
              app.kubernetes.io/name: open-webui
      ports:
        - port: 8555
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: home-assistant
              app.kubernetes.io/name: home-assistant
      ports:
        - port: 10200
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: piper-model-download
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: piper
      app.kubernetes.io/name: piper
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: huggingface.co
        - matchName: us.aws.cdn.hf.co
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
