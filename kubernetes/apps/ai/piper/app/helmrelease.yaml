---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piper
spec:
  chartRef:
    kind: OCIRepository
    name: piper
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      piper:
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/rhasspy/wyoming-piper
              tag: 2.5.2@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
            args: [--voice, en_US-lessac-medium, --download-dir, /data]
            env:
              HOME: /tmp
              TZ: Europe/Amsterdam
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/usr/src/.venv/bin/python3, -m, wyoming_piper.health_check]
                  periodSeconds: 30
                  timeoutSeconds: 20
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/usr/src/.venv/bin/python3, -m, wyoming_piper.health_check]
                  periodSeconds: 10
                  timeoutSeconds: 20
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
          gateway:
            image:
              repository: ghcr.io/archmonger/wyoming-openai-gateway
              tag: v0.2.1@sha256:d826f1ef5c6f313a7d85dcbbbd19dd2f4f8033ea0101b7671669f70e8c0a2d48
            env:
              TTS_HOST: 127.0.0.1
              TTS_PORT: "10200"
              PYTHONDONTWRITEBYTECODE: "1"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &httpPort 8555
                  timeoutSeconds: 5
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *httpPort
                  timeoutSeconds: 20
                  periodSeconds: 30
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *httpPort
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: piper
        ports:
          wyoming:
            port: 10200
          http:
            port: *httpPort
    persistence:
      data:
        existingClaim: piper
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
