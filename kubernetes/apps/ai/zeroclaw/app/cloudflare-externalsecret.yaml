---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zeroclaw-cloudflare
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: zeroclaw-cloudflare-secret
  data:
    - secretKey: token
      remoteRef:
        key: Cloudflare WAF
        property: API_TOKEN
