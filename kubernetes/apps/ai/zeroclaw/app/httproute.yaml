---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zeroclaw
  annotations:
    gatus.home-operations.com/endpoint: |-
      path: /
      conditions: ["[STATUS] == 302"]
spec:
  hostnames:
    - zeroclaw.aumer.dev
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - name: alertmanager
      matches:
        - path:
            type: Exact
            value: /sop/alertmanager
          method: POST
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Webhook-Secret
                value: "%REQ(Authorization)%"
      backendRefs:
        - name: zeroclaw
          port: 42617
    - backendRefs:
        - name: zeroclaw
          port: 42617
      name: ui
