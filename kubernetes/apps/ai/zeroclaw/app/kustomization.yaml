---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./config/github-hooks-config.sops.yaml
  - ./litellmvirtualkey.yaml
  - ./httproute.yaml
  - ./securitypolicy.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  - name: zeroclaw-config
    files:
      - config.toml=config/config.toml
  - name: zeroclaw-alert-sop
    files:
      - SOP.toml=config/alertmanager.toml
  - name: zeroclaw-workflow
    files:
      - state.py=../workflow/state.py
      - monitor.py=../workflow/monitor.py
      - session.py=../workflow/session.py
      - github_hooks.py=../workflow/github_hooks.py
      - server.py=../workflow/server.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
