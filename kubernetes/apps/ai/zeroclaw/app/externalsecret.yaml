---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zeroclaw
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: zeroclaw-secret
  data:
    - secretKey: client-secret
      remoteRef:
        key: zeroclaw
        property: OIDC_CLIENT_SECRET
    - secretKey: HOOK_TOKEN
      remoteRef:
        key: zeroclaw
        property: HOOK_TOKEN
