---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zeroclaw
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: zeroclaw-secret
  data:
    - secretKey: client-secret
      remoteRef:
        key: zeroclaw
        property: OIDC_CLIENT_SECRET
    - secretKey: HOOK_TOKEN
      remoteRef:
        key: zeroclaw
        property: HOOK_TOKEN
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: zeroclaw
        property: DISCORD_BOT_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zeroclaw-cloudflare
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: zeroclaw-cloudflare-secret
  data:
    - secretKey: token
      remoteRef:
        key: Cloudflare WAF
        property: API_TOKEN
