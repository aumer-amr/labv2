---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/valkey
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./litellmvirtualkey.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: open-webui-integrations
    files:
      - bootstrap.py=integrations/bootstrap.py
      # Vendored from eleboucher/memini v0.7.32; only _namespace adds pinned-account sharing.
      - memini_memory.py=integrations/memini_memory.py
generatorOptions:
  disableNameSuffixHash: true
