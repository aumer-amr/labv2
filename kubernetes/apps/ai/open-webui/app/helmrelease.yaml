---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded
            command:
              - /bin/bash
              - -c
            args:
              - |
                set -eu
                mkdir -p "$STATIC_DIR"
                cp -R /app/backend/open_webui/static/. "$STATIC_DIR/"
                PYTHONPATH=/app/backend python /run/integrations/bootstrap.py
                export TOOL_SERVER_CONNECTIONS="$(
                  python -c 'import json, os; print(json.dumps([{"type": "mcp", "url": "http://litellm.ai.svc.cluster.local:4000/mcp/proxy", "path": "", "auth_type": "bearer", "key": os.environ["OPENAI_API_KEY"], "config": {"enable": True}, "info": {"id": "litellm-mcp", "name": "LiteLLM MCP", "description": "Home Assistant tools through LiteLLM"}}]))'
                )"
                exec bash start.sh
            env:
              ANONYMIZED_TELEMETRY: "false"
              AUDIO_STT_ENGINE: openai
              AUDIO_STT_MODEL: whisper-base
              AUDIO_STT_OPENAI_API_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              AUDIO_STT_OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-litellm
                    key: key
              AUDIO_TTS_ENGINE: openai
              AUDIO_TTS_MODEL: wyoming
              AUDIO_TTS_OPENAI_API_BASE_URL: http://piper.ai.svc.cluster.local:8555/v1
              AUDIO_TTS_OPENAI_API_KEY: ""
              AUDIO_TTS_OPENAI_PARAMS: '{"response_format":"wav"}'
              AUDIO_TTS_VOICE: en_US-lessac-medium
              BYPASS_WEB_SEARCH_WEB_LOADER: "true"
              DO_NOT_TRACK: "true"
              DEFAULT_MODELS: qwen3.5-9b-fallback
              ENABLE_DIRECT_CONNECTIONS: "false"
              ENABLE_LOGIN_FORM: "false"
              ENABLE_OAUTH_PERSISTENT_CONFIG: "false"
              ENABLE_OAUTH_SIGNUP: "true"
              ENABLE_OLLAMA_API: "false"
              ENABLE_OPENAI_API: "true"
              ENABLE_RAG_HYBRID_SEARCH: "true"
              ENABLE_PERSISTENT_CONFIG: "false"
              ENABLE_SIGNUP: "false"
              ENABLE_VERSION_UPDATE_CHECK: "false"
              ENABLE_WEB_SEARCH: "true"
              ENABLE_WEBSOCKET_SUPPORT: "true"
              HOME: /app/backend/data
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8081
              MEMINI_SHARED_NAMESPACE: hermes
              MEMINI_SHARED_USER_ID: e071d5e0-ff79-4227-80e4-1c3159d57b18
              OAUTH_CODE_CHALLENGE_METHOD: S256
              OAUTH_PROVIDER_NAME: Kanidm
              OAUTH_SCOPES: openid email profile
              OPENAI_API_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-litellm
                    key: key
              OPENID_PROVIDER_URL: https://idm.aumer.dev/oauth2/openid/open-webui/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://chat.aumer.dev/oauth/oidc/callback
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: qwen3-embedding
              RAG_OPENAI_API_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              RAG_OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-litellm
                    key: key
              RAG_RERANKING_ENGINE: external
              RAG_RERANKING_MODEL: qwen3-reranker-0.6b
              RAG_EXTERNAL_RERANKER_URL: http://qwen3-reranker-0-6b.ai.svc.cluster.local:8080/v1/rerank
              RAG_EXTERNAL_RERANKER_TIMEOUT: "15"
              RAG_TOP_K: "10"
              RAG_TOP_K_RERANKER: "3"
              REDIS_KEY_PREFIX: open-webui
              SEARXNG_QUERY_URL: "http://searxng.ai.svc.cluster.local:8080/search?q=<query>"
              STATIC_DIR: /app/backend/data/static
              TASK_MODEL_EXTERNAL: qwen3.5-9b-fallback
              TZ: Europe/Amsterdam
              WEB_SEARCH_ENGINE: searxng
              WEBUI_URL: https://chat.aumer.dev
              WEBSOCKET_MANAGER: redis
            envFrom:
              - secretRef:
                  name: open-webui-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      automountServiceAccountToken: false
      labels:
        network.home.arpa/from-envoy-internal: allow
        network.home.arpa/to-envoy-external: allow
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        # Existing root-owned database/cache files need group write access.
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: open-webui
        ports:
          http:
            port: *port
    persistence:
      integrations:
        type: configMap
        name: open-webui-integrations
        globalMounts:
          - path: /run/integrations
            readOnly: true
      data:
        existingClaim: open-webui
        globalMounts:
          - path: /app/backend/data
