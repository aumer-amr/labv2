---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  chartRef:
    kind: OCIRepository
    name: memini
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            network.home.arpa/from-envoy-internal: allow
        containers:
          main:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
              MEMINI_EMBED_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-litellm-secret
                    key: LITELLM_API_KEY
              MEMINI_EMBED_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_MODEL: qwen3-embedding
              MEMINI_LLM_API: openai
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-litellm-secret
                    key: LITELLM_API_KEY
              MEMINI_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_LLM_EXTRA_BODY: '{"additional_drop_params":["temperature"]}'
              MEMINI_LLM_MODEL: gpt-5.6-luna
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      data:
        existingClaim: memini
    serviceMonitor:
      main:
        enabled: true
