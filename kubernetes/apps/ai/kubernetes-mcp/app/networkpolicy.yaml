# Configuration-derived flows; fresh audit traffic and separate review gate enforcement.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 8080
          protocol: TCP
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubernetes-mcp-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-to-kubernetes-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubernetes-mcp
      ports:
        - port: 8080
          protocol: TCP
