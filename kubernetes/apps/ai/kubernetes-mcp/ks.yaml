---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubernetes-mcp
spec:
  dependsOn:
    - name: litellm-operator
      namespace: ai
    - name: network-policies
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/kubernetes-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
