---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: truenas-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: truenas-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - ipBlock:
            cidr: 10.10.1.3/32
      ports:
        - port: 443
          protocol: TCP
