---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: truenas-mcp-secret
  data:
    - secretKey: TRUENAS_API_KEY
      remoteRef:
        key: truenas-mcp
        property: API_KEY
