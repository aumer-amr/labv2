---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-automation
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paseo-automation-secret
  data:
    - secretKey: PASEO_PASSWORD
      remoteRef:
        key: paseo-automation
        property: password
