---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paseo-automation
spec:
  chartRef:
    kind: OCIRepository
    name: paseo-automation
  interval: 1h
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          runtimeClassName: gvisor
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/aumer-amr/paseo-codex
              tag: sha-8608eac@sha256:e04c0e4612b33055d17e5e394adc0297e7f1fd68f6aa2c5da37df6e6067b7465
            env:
              TZ: Europe/Amsterdam
              PASEO_LISTEN: 0.0.0.0:6767
              PASEO_HOSTNAMES: paseo-automation.aumer.dev
              PASEO_CORS_ORIGINS: https://paseo.aumer.dev
              PASEO_TRUSTED_PROXIES: 10.42.0.0/16
              PASEO_WEB_UI_ENABLED: "false"
              PASEO_RELAY_ENABLED: "false"
              PASEO_LOG_FILE_LEVEL: info
              PASEO_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: paseo-automation-secret
                    key: PASEO_PASSWORD
            command: [/bin/bash, /etc/paseo/start.sh]
            ports:
              - name: http
                containerPort: &port 6767
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 8Gi
    service:
      app:
        controller: main
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - paseo-automation.aumer.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - timeouts:
              request: 0s
              backendRequest: 0s
            backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: paseo-automation
        advancedMounts:
          main:
            app:
              - path: /home/paseo
                subPath: home
              - path: /workspace
                subPath: workspace
      config:
        type: configMap
        name: paseo-automation-config
        globalMounts:
          - path: /etc/paseo
            readOnly: true
      tmp:
        type: emptyDir
