---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langfuse
  annotations:
    gatus.home-operations.com/endpoint: |-
      path: /api/public/health
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - langfuse.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: langfuse-web
          port: 3000
