---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-clickhouse-client
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: langfuse-clickhouse-client
    template:
      data:
        CLICKHOUSE_PASSWORD: "{{ .CLICKHOUSE_PASSWORD }}"
  dataFrom:
    - extract:
        key: langfuse
