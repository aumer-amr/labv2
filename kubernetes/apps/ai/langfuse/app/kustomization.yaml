---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/cnpg
  - ../../../../components/valkey
resources:
  - ./externalsecret.yaml
  - ./clickhouse-externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./httproute.yaml
  - ./networkpolicy.yaml
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: .*-valkey
    patch: |-
      - op: replace
        path: /spec/values/persistence/enabled
        value: true
      - op: add
        path: /spec/values/persistence/size
        value: 1Gi
      - op: add
        path: /spec/values/persistence/storageClass
        value: ceph-block
      - op: add
        path: /spec/values/persistence/keepOnUninstall
        value: true
      - op: replace
        path: /spec/values/extraConfig
        value: |-
          maxmemory 192mb
          maxmemory-policy noeviction
          appendonly yes
          appendfsync everysec
