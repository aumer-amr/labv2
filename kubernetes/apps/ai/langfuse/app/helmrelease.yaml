---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
spec:
  interval: 1h
  timeout: 15m
  values:
    langfuse:
      salt:
        secretKeyRef:
          name: langfuse-secret
          key: SALT
      encryptionKey:
        secretKeyRef:
          name: langfuse-secret
          key: ENCRYPTION_KEY
      nextauth:
        url: https://langfuse.${SECRET_DOMAIN}
        secret:
          secretKeyRef:
            name: langfuse-secret
            key: NEXTAUTH_SECRET
      features:
        telemetryEnabled: false
        signUpDisabled: false
      serviceAccount:
        name: langfuse-app
        automountServiceAccountToken: false
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      pod:
        labels:
          network.home.arpa/from-envoy-internal: allow
          network.home.arpa/to-envoy-external: allow
      additionalEnvFrom:
        - secretRef:
            name: langfuse-secret
      additionalEnv:
        - name: AUTH_CUSTOM_NAME
          value: "Kanidm"
        - name: AUTH_CUSTOM_ISSUER
          value: "https://idm.${SECRET_DOMAIN}/oauth2/openid/langfuse"
        - name: AUTH_CUSTOM_SCOPE
          value: "openid email profile"
        - name: AUTH_CUSTOM_ID_TOKEN
          value: "true"
        - name: AUTH_CUSTOM_FETCH_USERINFO
          value: "true"
        - name: AUTH_CUSTOM_CHECKS
          value: "pkce,state"
        - name: AUTH_CUSTOM_ID_TOKEN_SIGNED_RESPONSE_ALG
          value: "ES256"
        - name: AUTH_CUSTOM_CLIENT_AUTH_METHOD
          value: "client_secret_basic"
        - name: AUTH_DISABLE_USERNAME_PASSWORD
          value: "true"
        - name: LANGFUSE_DEFAULT_ORG_ID
          value: "labv2"
        - name: LANGFUSE_DEFAULT_ORG_ROLE
          value: "MEMBER"
        - name: LANGFUSE_DEFAULT_PROJECT_ID
          value: "cluster-monitor"
        - name: LANGFUSE_DEFAULT_PROJECT_ROLE
          value: "ADMIN"
        - name: LANGFUSE_INIT_ORG_ID
          value: labv2
        - name: LANGFUSE_INIT_ORG_NAME
          value: Lab
        - name: LANGFUSE_INIT_PROJECT_ID
          value: cluster-monitor
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: Cluster monitor
        - name: LANGFUSE_INIT_PROJECT_RETENTION
          value: "30"
      web:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        pdb:
          create: false
      worker:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        pdb:
          create: false
      extraVolumes:
        - name: tmp
          emptyDir: {}
      extraVolumeMounts:
        - name: tmp
          mountPath: /tmp
      deployment:
        annotations:
          reloader.stakater.com/auto: "true"
    postgresql:
      deploy: false
      host: langfuse-rw.ai.svc.cluster.local
      port: 5432
      auth:
        username: langfuse
        database: langfuse
        existingSecret: langfuse-postgres
        secretKeys:
          userPasswordKey: password
        args: sslmode=require
    redis:
      deploy: false
      host: langfuse-valkey.ai.svc.cluster.local
      port: 6379
      auth:
        existingSecret: langfuse-valkey
        existingSecretPasswordKey: VALKEY_PASSWORD
    clickhouse:
      deploy: false
      host: langfuse-clickhouse
      database: default
      cluster:
        enabled: false
      auth:
        username: langfuse
        existingSecret: langfuse-clickhouse-secret
        existingSecretKey: CLICKHOUSE_PASSWORD
    s3:
      deploy: false
      bucket: langfuse
      region: auto
      endpoint: https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
      forcePathStyle: true
      accessKeyId:
        secretKeyRef:
          name: langfuse-secret
          key: S3_ACCESS_KEY_ID
      secretAccessKey:
        secretKeyRef:
          name: langfuse-secret
          key: S3_SECRET_ACCESS_KEY
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: langfuse-web
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  httpGet:
                    path: /api/public/health
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
  chartRef:
    kind: OCIRepository
    name: langfuse
