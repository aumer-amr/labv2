---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-monitor
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-monitor-secret
    template:
      data:
        API_SERVER_KEY: "{{ .HERMES_API_KEY }}"
  dataFrom:
    - extract:
        key: windmill
