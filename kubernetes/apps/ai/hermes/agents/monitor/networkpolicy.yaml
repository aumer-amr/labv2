---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-monitor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-monitor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              release: windmill
              app: windmill-workers
      ports:
        - port: 8642
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-mcp
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victorialogs-mcp
      ports:
        - port: 8081
          protocol: TCP
