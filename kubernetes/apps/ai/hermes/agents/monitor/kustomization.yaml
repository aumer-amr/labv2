---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./configmap.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./litellmvirtualkey.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: hermes-monitor-litellm-schema
    files:
      - ./litellm-schema/__init__.py
      - ./litellm-schema/plugin.yaml
generatorOptions:
  disableNameSuffixHash: true
