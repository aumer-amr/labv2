---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: gvisor
      namespace: kube-system
    - name: kopiur
      namespace: kube-system
    - name: litellm
      namespace: ai
    - name: memini
      namespace: ai
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/ai/hermes/app
  postBuild:
    substitute:
      APP: hermes
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PGID: "10000"
      KOPIUR_PUID: "10000"
      NAMESPACE: ai
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
