---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  config.yaml: |-
    _config_version: 39
    timezone: Europe/Amsterdam
    database:
      journal_mode: delete
    model:
      default: qwen3.5-9b-fallback
      provider: lab-litellm
      context_length: 65536
    fallback_providers: []
    model_overrides:
      lab-litellm:
        qwen3.5-9b-fallback:
          context_window: 65536
          supports_tools: true
          supports_vision: false
          supports_reasoning: false
    providers:
      lab-litellm:
        api: http://litellm.ai.svc.cluster.local:4000/v1
        key_env: LITELLM_API_KEY
        transport: chat_completions
        request_timeout_seconds: 1800
    memory:
      provider: memini
    plugins:
      enabled:
        - discord-platform
        - memini
    skills:
      disabled:
        - airtable
        - arxiv
        - baoyu-infographic
        - competitor-news-monitor
        - xurl
        - youtube-content
    mcp_servers:
      litellm:
        url: http://litellm.ai.svc.cluster.local:4000/mcp/proxy
        headers:
          x-litellm-api-key: Bearer $${LITELLM_API_KEY}
    web:
      search_backend: searxng
    curator:
      enabled: false
    stt:
      enabled: false
    wake_word:
      enabled: false
    model_catalog:
      enabled: false
      excluded_providers:
        - opencode-free
    models_dev:
      # ponytail: Hermes lacks models_dev.enabled; use loopback until upstream adds it.
      url: http://127.0.0.1:9
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 180
      persistent_shell: true
    compression:
      enabled: true
      protect_last_n: 20
      threshold: 0.5
    auxiliary:
      title_generation:
        model_upgrade_enabled: false
      compression:
        timeout: 1800
    agent:
      system_prompt: |-
        When the user asks to create a GitHub issue, use the terminal tool and the
        authenticated GitHub CLI: gh issue create --repo aumer-amr/labv2 --title
        '<title>' --body-file '<body-file>'. Write the requested body to a temporary
        file and safely quote shell arguments. Return the issue URL from the command.
        If authentication or permissions fail, report the failure clearly and ask
        for the existing Hermes GitHub credential to have repository Issues write
        permission through the existing secret provider. Keep credentials private.
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      api_max_retries: 2
      reasoning_effort: medium
      reasoning_overrides:
        qwen3.5-9b-fallback: false
      disabled_toolsets:
        - browser
        - code_execution
        - computer_use
        - image_gen
        - skills
        - tts
        - vision
    security:
      redact_secrets: true
      website_blocklist:
        enabled: true
        domains:
          - 169.254.169.254
          - metadata.google.internal
    privacy:
      redact_pii: true
    dashboard:
      theme: mono
      public_url: https://hermes.aumer.dev
      oauth:
        provider: self-hosted
        self_hosted:
          issuer: https://idm.aumer.dev/oauth2/openid/hermes
          client_id: hermes
