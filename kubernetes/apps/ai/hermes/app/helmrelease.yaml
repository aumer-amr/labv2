---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          fix-run:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
            command:
              - /bin/sh
              - -c
              - chmod 0755 /run && chown 10000:10000 /run
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - CHOWN
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
        containers:
          app:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
            args:
              - sleep
              - infinity
            env:
              HERMES_DASHBOARD: "1"
              HERMES_GATEWAY_BOOTSTRAP_STATE: running
              HERMES_HOME: /opt/data
              HOME: /opt/data
              DISCORD_ALLOWED_CHANNELS:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: DISCORD_ALLOWED_CHANNELS
              DISCORD_ALLOWED_USERS:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: DISCORD_ALLOWED_USERS
              DISCORD_BOT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: DISCORD_BOT_TOKEN
              DISCORD_HOME_CHANNEL:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: DISCORD_HOME_CHANNEL
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: key
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_NAMESPACE: hermes
              TZ: Europe/Amsterdam
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/status
                    port: &port 9119
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/status
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  httpGet:
                    path: /api/status
                    port: *port
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
            ports:
              - containerPort: *port
                name: http
                protocol: TCP
    defaultPodOptions:
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      labels:
        network.home.arpa/from-envoy-internal: allow
        network.home.arpa/to-envoy-external: allow
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
    persistence:
      config:
        type: configMap
        name: hermes-config
        advancedMounts:
          hermes:
            app:
              - path: /opt/data/config.yaml
                subPath: config.yaml
                readOnly: true
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
      memini-plugin:
        type: configMap
        name: hermes-memini
        advancedMounts:
          hermes:
            app:
              - path: /opt/data/plugins/memini
                readOnly: true
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            fix-run:
              - path: /run
            app:
              - path: /run
      tmp:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /tmp
    service:
      app:
        controller: hermes
        ports:
          http:
            port: *port
