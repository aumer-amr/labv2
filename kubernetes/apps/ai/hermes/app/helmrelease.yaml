---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          00-fix-permissions:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
            command:
              - /bin/sh
              - -c
              - chmod 0755 /run /workspace && chown 10000:10000 /run /workspace
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - CHOWN
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
          bootstrap:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
            command:
              - /opt/hermes/.venv/bin/python
              - -I
              - /run/bootstrap/bootstrap.py
              - initialize
            env:
              DISCORD_ALERTS_CHANNEL: "1546583960329392218"
              DISCORD_REVIEWS_CHANNEL: "1546583979401154582"
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: GH_TOKEN
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
          prepare-merge-broker:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
            command:
              - /opt/hermes/.venv/bin/python
              - -I
              - /run/bootstrap/bootstrap.py
              - prepare-merge-broker
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
          verify-read-token:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
            command:
              - /opt/hermes/.venv/bin/python
              - -I
              - /run/bootstrap/bootstrap.py
              - verify-read-token
            env:
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: GH_TOKEN
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
        containers:
          app:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
            args:
              - sleep
              - infinity
            env:
              HERMES_DASHBOARD: "1"
              HERMES_ASSESSMENT_EXCHANGE: /run/assessment-exchange
              HERMES_GATEWAY_BOOTSTRAP_STATE: running
              HERMES_HOME: /opt/data
              HOME: /opt/data
              GH_CONFIG_DIR: /run/gh
              PATH: /opt/tools:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/bin:/usr/bin:/bin
              DISCORD_ALLOWED_CHANNELS:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: DISCORD_ALLOWED_CHANNELS
              DISCORD_ALLOWED_USERS:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: DISCORD_ALLOWED_USERS
              DISCORD_BOT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: DISCORD_BOT_TOKEN
              DISCORD_HOME_CHANNEL:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: DISCORD_HOME_CHANNEL
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: key
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_NAMESPACE: hermes
              SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
              TZ: Europe/Amsterdam
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/status
                    port: &port 9119
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/status
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  httpGet:
                    path: /api/status
                    port: *port
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
            ports:
              - containerPort: *port
                name: http
                protocol: TCP
          merge-broker:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
            command:
              - /opt/hermes/.venv/bin/python
              - -I
            args:
              - /run/broker/assessment.py
              - serve
              - --host
              - 127.0.0.1
              - --port
              - "9171"
            env:
              GH_CONFIG_DIR: /tmp-private/gh
              HERMES_ASSESSMENT_EXCHANGE: /run/assessment-exchange
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: GH_MERGE_TOKEN
              HOME: /tmp-private
              PATH: /run/broker:/usr/local/bin:/usr/bin:/bin
              TMPDIR: /tmp-private
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    defaultPodOptions:
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      runtimeClassName: gvisor
      labels:
        network.home.arpa/from-envoy-internal: allow
        network.home.arpa/to-envoy-external: allow
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
    persistence:
      assessment-exchange:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run/assessment-exchange
            merge-broker:
              - path: /run/assessment-exchange
      config:
        type: configMap
        name: hermes-config
        advancedMounts:
          hermes:
            bootstrap:
              - path: /opt/data/config.yaml
                subPath: config.yaml
                readOnly: true
            app:
              - path: /opt/data/config.yaml
                subPath: config.yaml
                readOnly: true
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            bootstrap:
              - path: /opt/data
            app:
              - path: /opt/data
      tools:
        type: emptyDir
        advancedMounts:
          hermes:
            bootstrap:
              - path: /opt/tools
            app:
              - path: /opt/tools
            prepare-merge-broker:
              - path: /opt/tools
                readOnly: true
      bootstrap:
        type: configMap
        name: hermes-bootstrap
        advancedMounts:
          hermes:
            bootstrap:
              - path: /run/bootstrap
                readOnly: true
            prepare-merge-broker:
              - path: /run/bootstrap
                readOnly: true
            verify-read-token:
              - path: /run/bootstrap
                readOnly: true
      private-skills:
        type: secret
        name: hermes-private-skills
        advancedMounts:
          hermes:
            bootstrap:
              - path: /run/private-skills
                readOnly: true
            prepare-merge-broker:
              - path: /run/private-skills
                readOnly: true
      merge-broker:
        type: emptyDir
        advancedMounts:
          hermes:
            prepare-merge-broker:
              - path: /run/broker
            merge-broker:
              - path: /run/broker
                readOnly: true
      renovate-workspace:
        type: emptyDir
        advancedMounts:
          hermes:
            00-fix-permissions:
              - path: /workspace
            bootstrap:
              - path: /opt/data/renovate-workspace
            app:
              - path: /opt/data/renovate-workspace
      private-skill-runtime:
        type: emptyDir
        advancedMounts:
          hermes:
            bootstrap:
              - path: /opt/data/skills/private
            app:
              - path: /opt/data/skills/private
                readOnly: true
      private-runner-runtime:
        type: emptyDir
        advancedMounts:
          hermes:
            bootstrap:
              - path: /opt/data/scripts/private
            app:
              - path: /opt/data/scripts/private
                readOnly: true
      private-prompt-runtime:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /opt/data/private-prompts
                readOnly: true
            bootstrap:
              - path: /opt/data/private-prompts
      memini-plugin:
        type: configMap
        name: hermes-memini
        advancedMounts:
          hermes:
            app:
              - path: /opt/data/plugins/memini
                readOnly: true
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            00-fix-permissions:
              - path: /run
            bootstrap:
              - path: /run-shared
            app:
              - path: /run
      tmp:
        type: emptyDir
        advancedMounts:
          hermes:
            bootstrap:
              - path: /tmp
            app:
              - path: /tmp
            merge-broker:
              - path: /tmp
                readOnly: true
      merge-broker-tmp:
        type: emptyDir
        advancedMounts:
          hermes:
            merge-broker:
              - path: /tmp-private
      merge-broker-state:
        existingClaim: hermes-merge-broker-state
        advancedMounts:
          hermes:
            merge-broker:
              - path: /var/lib/hermes-broker
      service-account:
        type: custom
        volumeSpec:
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  items:
                    - key: ca.crt
                      path: ca.crt
                  name: kube-root-ca.crt
              - downwardAPI:
                  items:
                    - fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
                      path: namespace
        advancedMounts:
          hermes:
            app:
              - path: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
            merge-broker:
              - path: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
    service:
      app:
        controller: hermes
        ports:
          http:
            port: *port
