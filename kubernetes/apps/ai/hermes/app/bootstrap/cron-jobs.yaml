jobs:
  - name: Weekly Renovate assessment
    schedule: 0 10 * * 0
    deliver_env: DISCORD_REVIEWS_CHANNEL
    script: private/assess-renovate-prs.sh
    no_agent: true
    workdir: /opt/data/renovate-workspace
  - name: Morning exception brief
    enabled: false
    schedule: 30 7 * * *
    deliver_env: DISCORD_ALERTS_CHANNEL
    provider: lab-litellm
    model: gpt-6-luna
    reasoning_effort: low
    prompt: >-
      Check today's Home Assistant calendars, unavailable devices, batteries below 20%, unusual energy use compared with recent history, and current Kubernetes or Flux alerts. Use the Prometheus MCP to query firing alerts, Flux readiness, pod restart increases, CPU and memory trends, and Ceph health over the past 24 hours. Correlate active exceptions with current Kubernetes conditions and recent VictoriaLogs errors before reporting them. Include the query time window and evidence; if a tool is unavailable, state that coverage is incomplete rather than claiming there are no exceptions. Do not report unavailable Android Auto car telemetry sensors; they are expected outside an active vehicle connection. For HTTP endpoints, evaluate responses against their configured Gatus conditions instead of assuming non-2xx means failure. The Flux webhook base URL is expected to return 404 because only /hook/ is routed; report it only if its HTTPRoute is unhealthy or notification-controller logs show a failed expected delivery. For Kopiur backups, ignore MissingDependency and mover-pod FailedScheduling warnings when the corresponding Snapshot subsequently reached Succeeded; report only Snapshots still Pending beyond their 10-minute staging timeout or in Failed/Stalled state. Treat VolumeFailedDelete events as active only when the referenced PV or VolumeAttachment still exists and remains terminating or attached for at least five minutes after the mover Job completed; retained events whose storage objects are gone are not exceptions. An unknown last-event time alone is not an exception. Report only items needing attention, with concise evidence and urgency. Make no changes. If nothing needs attention and all required sources were checked, respond exactly: No exceptions.
  - name: Weekly personal review
    schedule: 0 18 * * 0
    deliver_env: DISCORD_REVIEWS_CHANNEL
    provider: lab-litellm
    model: gpt-6.1-sol
    reasoning_effort: medium
    prompt: >-
      Review the past seven days and next seven days using Home Assistant calendars and history, Paperless documents, GitHub activity, and remembered commitments. Summarize unfinished actions, upcoming deadlines, household maintenance, and open technical risks. Return at most five prioritized actions with concise evidence. Make no changes.
