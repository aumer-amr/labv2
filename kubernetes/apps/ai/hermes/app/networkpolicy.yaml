---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: hermes
      app.kubernetes.io/name: hermes
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - port: 9119
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-external
      ports:
        - port: 10443
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini
              app.kubernetes.io/name: memini
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: searxng
              app.kubernetes.io/name: searxng
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-oidc
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: hermes
      app.kubernetes.io/name: hermes
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchName: discord.com
              - matchPattern: discord.com.*
              - matchName: gateway.discord.gg
              - matchPattern: gateway.discord.gg.*
              - matchName: hermes-agent.nousresearch.com
              - matchPattern: hermes-agent.nousresearch.com.*
              - matchName: nousresearch.github.io
              - matchPattern: nousresearch.github.io.*
              - matchName: idm.${SECRET_DOMAIN}
              - matchName: litellm.ai.svc.cluster.local
              - matchName: memini.ai.svc.cluster.local
              - matchName: searxng.ai.svc.cluster.local
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: discord.com
              - matchPattern: discord.com.*
              - matchName: gateway.discord.gg
              - matchPattern: gateway.discord.gg.*
              - matchName: hermes-agent.nousresearch.com
              - matchPattern: hermes-agent.nousresearch.com.*
              - matchName: nousresearch.github.io
              - matchPattern: nousresearch.github.io.*
              - matchName: idm.${SECRET_DOMAIN}
              - matchName: litellm.ai.svc.cluster.local
              - matchName: memini.ai.svc.cluster.local
              - matchName: searxng.ai.svc.cluster.local
    - toFQDNs:
        - matchName: discord.com
        - matchName: discord.com.ai.svc.cluster.local
        - matchName: gateway.discord.gg
        - matchName: gateway.discord.gg.ai.svc.cluster.local
        - matchName: hermes-agent.nousresearch.com
        - matchName: hermes-agent.nousresearch.com.ai.svc.cluster.local
        - matchName: nousresearch.github.io
        - matchName: nousresearch.github.io.ai.svc.cluster.local
        - matchName: idm.${SECRET_DOMAIN}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-victoria-logs
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: hermes
      app.kubernetes.io/name: hermes
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/instance: victoria-logs
            app.kubernetes.io/name: victoria-logs-single
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: /select/logsql/query
