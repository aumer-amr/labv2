---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperless-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: administration
          podSelector:
            matchLabels:
              app.kubernetes.io/name: paperless
      ports:
        - port: 8000
          protocol: TCP
