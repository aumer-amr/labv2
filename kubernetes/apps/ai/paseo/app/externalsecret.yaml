---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paseo-secret
  data:
    - secretKey: PASEO_PASSWORD
      remoteRef:
        key: paseo
        property: password
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
