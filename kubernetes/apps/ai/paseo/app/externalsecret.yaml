---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paseo-secret
  data:
    - secretKey: PASEO_PASSWORD
      remoteRef:
        key: paseo
        property: password
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-langfuse-tracing
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paseo-langfuse-tracing
    template:
      data:
        langfuse.json: |
          {
            "enabled": true,
            "base_url": "http://langfuse-web.ai.svc.cluster.local:3000",
            "public_key": {{ .publicKey | toJson }},
            "secret_key": {{ .secretKey | toJson }}
          }
  data:
    - secretKey: publicKey
      remoteRef:
        key: langfuse
        property: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
    - secretKey: secretKey
      remoteRef:
        key: langfuse
        property: LANGFUSE_INIT_PROJECT_SECRET_KEY
