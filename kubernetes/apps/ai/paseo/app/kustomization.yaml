---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./litellmvirtualkey.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: paseo-config
    files:
      - codex.toml=./config/config.toml
      - paseo.json=./config/paseo.json
generatorOptions:
  disableNameSuffixHash: true
