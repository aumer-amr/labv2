---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paseo
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
    - name: envoy-gateway
      namespace: network
    - name: kopiur
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: litellm
      namespace: ai
    - name: memini
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/paseo/app
  postBuild:
    substitute:
      APP: paseo
      NAMESPACE: ai
      KOPIUR_CAPACITY: 30Gi
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: true
