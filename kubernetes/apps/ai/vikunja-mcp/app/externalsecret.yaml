---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vikunja-mcp-secret
  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: vikunja
        property: MCP_API_TOKEN
