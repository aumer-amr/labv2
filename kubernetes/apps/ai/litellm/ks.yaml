---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
spec:
  dependsOn:
    - name: barman-cloud
      namespace: database
    - name: cloudnative-pg
      namespace: database
    - name: litellm-operator
      namespace: ai
    - name: envoy-gateway
      namespace: network
    - name: kube-prometheus-stack
      namespace: observability
    - name: onepassword-connect
      namespace: external-secrets
    - name: postgresql-images
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/ai/litellm/app
  postBuild:
    substitute:
      APP: litellm
      NAMESPACE: ai
      PG_BACKUP_BUCKET: pg-litellm
      PG_MAJOR: "18"
      PG_SSLMODE: require
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
