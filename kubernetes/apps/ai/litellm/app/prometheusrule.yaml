---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm
spec:
  groups:
    # Auth/quota alerts are disabled while ChatGPT is opt-in and quota exhaustion is expected.
    - name: llamacpp.rules
      rules:
        - alert: LlamaCppRequestsDeferred
          expr: |-
            max by (namespace, service) (llamacpp:requests_deferred{namespace="ai"}) > 0
          for: 10m
          annotations:
            summary: Inference requests are queuing on {{ $labels.service }}
            description: Requests have been queued for ten minutes; check model capacity and client concurrency.
          labels:
            severity: warning
