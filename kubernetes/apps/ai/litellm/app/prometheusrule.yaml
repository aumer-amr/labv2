---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm
spec:
  groups:
    - name: litellm.rules
      rules:
        - alert: LiteLLMAuthOrQuotaFailures
          expr: |-
            sum by (namespace, litellm_model_name, exception_status) (
              increase(litellm_deployment_failure_responses_total{namespace="ai", exception_status=~"401|403|429"}[15m])
            ) > 5
          for: 5m
          annotations:
            summary: LiteLLM {{ $labels.litellm_model_name }} has repeated authentication or quota failures
            description: Check the upstream credential, rate limit, and provider allowance (HTTP {{ $labels.exception_status }}).
          labels:
            severity: warning
    - name: llamacpp.rules
      rules:
        - alert: LlamaCppRequestsDeferred
          # The single-slot Qwen chat model is expected to queue under continuous use.
          expr: |-
            max by (namespace, service) (llamacpp:requests_deferred{namespace="ai", service!="qwen3.5-9b"}) > 0
          for: 10m
          annotations:
            summary: Inference requests are queuing on {{ $labels.service }}
            description: Requests have been queued for ten minutes; check model capacity and client concurrency.
          labels:
            severity: warning
