---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
  podLabels:
    network.home.arpa/from-envoy-internal: allow
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.98.0@sha256:20b5044b619055374061a6d5b7b08754cad75aeabbf82ddf4f69cc0cf80ddaf4
  replicas: 1
  generalSettings:
    health_check_endpoint: /v1/health
    use_x_forwarded_for: true
    mcp_trusted_proxy_ranges:
      - 10.42.0.0/16
    mcp_xff_num_trusted_hops: 1
  routerSettings:
    routing_strategy: simple-shuffle
    num_retries: 3
    timeout: 600
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    redis_password: os.environ/REDIS_PASSWORD
  litellmSettings:
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      password: os.environ/REDIS_PASSWORD
    success_callback:
      - prometheus
    failure_callback:
      - prometheus
    prometheus_adapter: true
    drop_params: true
    merge_reasoning_content_in_choices: true
  extraConfig:
    policies:
      prompt-injection-protection:
        description: Protects against prompt injection, SQL injection, code injection, and jailbreak attempts
        guardrails:
          add:
            - prompt-injection-blocker
            - sql-injection-blocker
            - code-injection-blocker
    policy_attachments:
      - policy: prompt-injection-protection
        scope: "*"
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: DATABASE_URL
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://idm.${SECRET_DOMAIN}/ui/oauth2
    - name: GENERIC_CLIENT_ID
      value: litellm
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: GENERIC_CLIENT_SECRET
    - name: GENERIC_CLIENT_USE_PKCE
      value: "true"
    - name: GENERIC_SCOPE
      value: openid profile email groups
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://idm.${SECRET_DOMAIN}/oauth2/token
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://idm.${SECRET_DOMAIN}/oauth2/openid/litellm/userinfo
    - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
      value: name
    - name: GENERIC_USER_EMAIL_ATTRIBUTE
      value: email
    - name: GENERIC_USER_FIRST_NAME_ATTRIBUTE
      value: given_name
    - name: GENERIC_USER_ID_ATTRIBUTE
      value: sub
    - name: GENERIC_USER_LAST_NAME_ATTRIBUTE
      value: family_name
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_MASTER_KEY
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_SALT_KEY
    - name: PROXY_BASE_URL
      value: https://litellm.${SECRET_DOMAIN}
    - name: REDIS_HOST
      value: litellm-valkey.ai.svc.cluster.local.
    - name: REDIS_PORT
      value: "6379"
    - name: REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: REDIS_PASSWORD
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 4000
