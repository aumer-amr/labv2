---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  podLabels:
    network.home.arpa/from-envoy-internal: allow
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.96.0@sha256:90d8de0ea6fbb3cad145d1019d00a0149ae400b1e18e2011a60f1988f143f672
  replicas: 1
  generalSettings:
    health_check_endpoint: /v1/health
  routerSettings:
    routing_strategy: simple-shuffle
    num_retries: 3
    timeout: 600
  litellmSettings:
    success_callback:
      - prometheus
    prometheus_adapter: true
    drop_params: true
    merge_reasoning_content_in_choices: true
  env:
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://idm.${SECRET_DOMAIN}/ui/oauth2
    - name: GENERIC_CLIENT_ID
      value: litellm
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-client
          key: client-secret
    - name: GENERIC_CLIENT_USE_PKCE
      value: "true"
    - name: GENERIC_SCOPE
      value: openid profile email groups
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://idm.${SECRET_DOMAIN}/oauth2/token
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://idm.${SECRET_DOMAIN}/oauth2/openid/litellm/userinfo
    - name: GENERIC_USER_ID_ATTRIBUTE
      value: sub
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_MASTER_KEY
    - name: PROXY_BASE_URL
      value: https://litellm.${SECRET_DOMAIN}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 4000
