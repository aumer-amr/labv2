---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /tmp
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
  podLabels:
    network.home.arpa/from-envoy-internal: allow
    network.home.arpa/to-envoy-external: allow
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.106.4@sha256:c169fb3adc514fcf210377c203f3de406d54f10bfdacf13948a4a839db9af7de
  replicas: 1
  generalSettings:
    cancel_on_disconnect: true
    disable_env_credential_login: true
    health_check_endpoint: /v1/health
    use_x_forwarded_for: true
    mcp_trusted_proxy_ranges:
      - 10.42.0.0/16
    mcp_xff_num_trusted_hops: 1
  routerSettings:
    routing_strategy: simple-shuffle
    num_retries: 3
    timeout: 600
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    redis_password: os.environ/REDIS_PASSWORD
  litellmSettings:
    callbacks:
      - langfuse_otel
    mcp_tool_search:
      embedding_model: qwen3-embedding
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      password: os.environ/REDIS_PASSWORD
    success_callback:
      - prometheus
    failure_callback:
      - prometheus
    prometheus_adapter: true
    drop_params: true
    merge_reasoning_content_in_choices: true
  extraConfig:
    policies:
      prompt-injection-protection:
        description: Protects against prompt injection, SQL injection, code injection, and jailbreak attempts
        guardrails:
          add:
            - prompt-injection-blocker
            - sql-injection-blocker
            - code-injection-blocker
    policy_attachments:
      - policy: prompt-injection-protection
        keys:
          - open-webui
  env:
    - name: HOME
      value: /tmp
    - name: XDG_CACHE_HOME
      value: /tmp/.cache
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: DATABASE_URL
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://idm.aumer.dev/ui/oauth2
    - name: GENERIC_CLIENT_ID
      value: litellm
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: GENERIC_CLIENT_SECRET
    - name: GENERIC_CLIENT_USE_PKCE
      value: "true"
    - name: GENERIC_SCOPE
      value: openid profile email groups
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://idm.aumer.dev/oauth2/token
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://idm.aumer.dev/oauth2/openid/litellm/userinfo
    - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
      value: name
    - name: GENERIC_USER_EMAIL_ATTRIBUTE
      value: email
    - name: GENERIC_USER_FIRST_NAME_ATTRIBUTE
      value: given_name
    - name: GENERIC_USER_ID_ATTRIBUTE
      value: sub
    - name: GENERIC_USER_LAST_NAME_ATTRIBUTE
      value: family_name
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: LITELLM_OTEL_V2
      value: "true"
    - name: LITELLM_OTEL_LANGFUSE_SPAN_SCOPE
      value: llm_only
    - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
      value: no_content
    - name: LANGFUSE_OTEL_HOST
      value: http://langfuse-web.ai.svc.cluster.local:3000
    - name: LANGFUSE_PUBLIC_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse-secret
          key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
    - name: LANGFUSE_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse-secret
          key: LANGFUSE_INIT_PROJECT_SECRET_KEY
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_MASTER_KEY
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_SALT_KEY
    - name: PROXY_BASE_URL
      value: https://litellm.aumer.dev
    - name: REDIS_HOST
      value: litellm-valkey.ai.svc.cluster.local.
    - name: REDIS_PORT
      value: "6379"
    - name: REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: REDIS_PASSWORD
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 4000
