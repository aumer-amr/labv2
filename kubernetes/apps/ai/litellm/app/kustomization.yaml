---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/cnpg
  - ../../../../components/valkey
resources:
  - ./grafanadashboard.yaml
  - ./externalsecret.yaml
  - ./guardrails.yaml
  - ./httproute.yaml
  - ./litellmproxy.yaml
  - ./models/
  - ./networkpolicy.yaml
  - ./servicemonitor.yaml
configMapGenerator:
  - name: litellm-usage-dashboard
    files:
      - dashboard.json=resources/dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
