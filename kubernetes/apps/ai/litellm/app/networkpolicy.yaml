---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: krr
      ports:
        - port: 4000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: actions-runners
          podSelector:
            matchLabels:
              app.kubernetes.io/name: labv2-pr-reviewer
              app.kubernetes.io/instance: labv2-pr-reviewer
              app.kubernetes.io/component: runner
      ports:
        - port: 4000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - port: 4000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 4000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: litellm-operator
              app.kubernetes.io/name: litellm-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini
              app.kubernetes.io/name: memini
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: open-webui
              app.kubernetes.io/name: open-webui
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: hermes
              app.kubernetes.io/name: hermes
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-monitor
        - podSelector:
            matchLabels:
              release: windmill
              app: windmill-workers
      ports:
        - port: 4000
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: langfuse
              app.kubernetes.io/component: web
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: developer-tools
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: vikunja
              app.kubernetes.io/name: vikunja
      ports:
        - port: 3456
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: karakeep-mcp
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: actual-mcp
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana-mcp
      ports:
        - port: 8000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: truenas-mcp
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-mcp
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-external
      ports:
        - port: 10443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ha-mcp
      ports:
        - port: 8086
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: paperless-mcp
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: unifi-mcp
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: victorialogs-mcp
      ports:
        - port: 8081
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchExpressions:
              - key: inference.llmkube.dev/service
                operator: In
                values:
                  - qwen3.5-9b
                  - qwen3-5-9b-fallback
                  - qwen3-embedding-0.6b
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: konflate
              app.kubernetes.io/name: konflate
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-external
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchName: api.openai.com
              - matchName: idm.aumer.dev
              - matchName: raw.githubusercontent.com
              - matchName: ha-mcp.ai.svc.cluster.local
              - matchName: konflate.flux-system.svc.cluster.local
              - matchName: litellm-rw.ai.svc.cluster.local
              - matchName: litellm-valkey.ai.svc.cluster.local
              - matchName: langfuse-web.ai.svc.cluster.local
              - matchName: paperless-mcp.ai.svc.cluster.local
              - matchName: prometheus-mcp.ai.svc.cluster.local
              - matchName: kubernetes-mcp.ai.svc.cluster.local
              - matchName: actual-mcp.ai.svc.cluster.local
              - matchName: vikunja.developer-tools.svc.cluster.local
              - matchName: karakeep-mcp.ai.svc.cluster.local
              - matchName: grafana-mcp.ai.svc.cluster.local
              - matchName: qwen3-embedding-0-6b.ai.svc.cluster.local
              - matchName: qwen3-5-9b.ai.svc.cluster.local
              - matchName: qwen3-5-9b-fallback.ai.svc.cluster.local
              - matchName: unifi-mcp.ai.svc.cluster.local
              - matchName: truenas-mcp.ai.svc.cluster.local
              - matchName: victorialogs-mcp.ai.svc.cluster.local
              - matchName: whisper.ai.svc.cluster.local
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: api.openai.com
              - matchName: idm.aumer.dev
              - matchName: raw.githubusercontent.com
              - matchName: ha-mcp.ai.svc.cluster.local
              - matchName: konflate.flux-system.svc.cluster.local
              - matchName: litellm-rw.ai.svc.cluster.local
              - matchName: litellm-valkey.ai.svc.cluster.local
              - matchName: langfuse-web.ai.svc.cluster.local
              - matchName: paperless-mcp.ai.svc.cluster.local
              - matchName: prometheus-mcp.ai.svc.cluster.local
              - matchName: kubernetes-mcp.ai.svc.cluster.local
              - matchName: actual-mcp.ai.svc.cluster.local
              - matchName: vikunja.developer-tools.svc.cluster.local
              - matchName: karakeep-mcp.ai.svc.cluster.local
              - matchName: grafana-mcp.ai.svc.cluster.local
              - matchName: qwen3-embedding-0-6b.ai.svc.cluster.local
              - matchName: qwen3-5-9b.ai.svc.cluster.local
              - matchName: qwen3-5-9b-fallback.ai.svc.cluster.local
              - matchName: unifi-mcp.ai.svc.cluster.local
              - matchName: truenas-mcp.ai.svc.cluster.local
              - matchName: victorialogs-mcp.ai.svc.cluster.local
              - matchName: whisper.ai.svc.cluster.local
    - toFQDNs:
        - matchName: api.openai.com
        - matchName: idm.aumer.dev
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
