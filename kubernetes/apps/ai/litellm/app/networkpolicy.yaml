---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - port: 4000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 4000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: litellm-operator
              app.kubernetes.io/name: litellm-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini
              app.kubernetes.io/name: memini
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: open-webui
              app.kubernetes.io/name: open-webui
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: hermes
              app.kubernetes.io/name: hermes
      ports:
        - port: 4000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-external
      ports:
        - port: 10443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ha-mcp
      ports:
        - port: 8086
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: paperless-mcp
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchExpressions:
              - key: inference.llmkube.dev/service
                operator: In
                values:
                  - qwen3-embedding-0.6b
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: konflate
              app.kubernetes.io/name: konflate
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-external
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchName: api.openai.com
              - matchName: idm.${SECRET_DOMAIN}
              - matchName: raw.githubusercontent.com
              - matchName: ha-mcp.ai.svc.cluster.local
              - matchName: konflate.flux-system.svc.cluster.local
              - matchName: litellm-rw.ai.svc.cluster.local
              - matchName: litellm-valkey.ai.svc.cluster.local
              - matchName: paperless-mcp.ai.svc.cluster.local
              - matchName: qwen3-embedding-0-6b.ai.svc.cluster.local
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: api.openai.com
              - matchName: idm.${SECRET_DOMAIN}
              - matchName: raw.githubusercontent.com
              - matchName: ha-mcp.ai.svc.cluster.local
              - matchName: konflate.flux-system.svc.cluster.local
              - matchName: litellm-rw.ai.svc.cluster.local
              - matchName: litellm-valkey.ai.svc.cluster.local
              - matchName: paperless-mcp.ai.svc.cluster.local
              - matchName: qwen3-embedding-0-6b.ai.svc.cluster.local
    - toFQDNs:
        - matchName: api.openai.com
        - matchName: idm.${SECRET_DOMAIN}
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
