---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: speaches
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: speaches
      app.kubernetes.io/name: speaches
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: hermes
              app.kubernetes.io/name: hermes
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: speaches-model-downloads
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: speaches
      app.kubernetes.io/name: speaches
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchName: huggingface.co
              - matchName: huggingface.co.ai.svc.cluster.local
              - matchName: huggingface.co.svc.cluster.local
              - matchName: huggingface.co.cluster.local
              - matchPattern: "**.hf.co"
              - matchPattern: "**.hf.co.ai.svc.cluster.local"
              - matchPattern: "**.hf.co.svc.cluster.local"
              - matchPattern: "**.hf.co.cluster.local"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: huggingface.co
              - matchName: huggingface.co.ai.svc.cluster.local
              - matchName: huggingface.co.svc.cluster.local
              - matchName: huggingface.co.cluster.local
              - matchPattern: "**.hf.co"
              - matchPattern: "**.hf.co.ai.svc.cluster.local"
              - matchPattern: "**.hf.co.svc.cluster.local"
              - matchPattern: "**.hf.co.cluster.local"
    - toFQDNs:
        - matchName: huggingface.co
        - matchName: huggingface.co.ai.svc.cluster.local
        - matchName: huggingface.co.svc.cluster.local
        - matchName: huggingface.co.cluster.local
        - matchPattern: "**.hf.co"
        - matchPattern: "**.hf.co.ai.svc.cluster.local"
        - matchPattern: "**.hf.co.svc.cluster.local"
        - matchPattern: "**.hf.co.cluster.local"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
