---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speaches
spec:
  chartRef:
    kind: OCIRepository
    name: speaches
  interval: 1h
  values:
    controllers:
      speaches:
        strategy: Recreate
        initContainers:
          download-model:
            image: &image
              repository: ghcr.io/speaches-ai/speaches
              tag: 0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
            command:
              - python
              - -c
              - from huggingface_hub import snapshot_download; snapshot_download("Systran/faster-whisper-small")
            env: &env
              HF_HUB_CACHE: /home/ubuntu/.cache/huggingface/hub
              WHISPER__COMPUTE_TYPE: int8
              WHISPER__CPU_THREADS: "4"
              WHISPER__INFERENCE_DEVICE: cpu
              WHISPER__NUM_WORKERS: "1"
            securityContext: &containerSecurityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
        containers:
          app:
            image: *image
            env: *env
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 4Gi
            securityContext: *containerSecurityContext
            ports:
              - containerPort: *port
                name: http
                protocol: TCP
    defaultPodOptions:
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    persistence:
      cache:
        existingClaim: speaches-cache
        advancedMounts:
          speaches:
            download-model:
              - path: /home/ubuntu/.cache/huggingface/hub
            app:
              - path: /home/ubuntu/.cache/huggingface/hub
      tmp:
        type: emptyDir
        advancedMounts:
          speaches:
            download-model:
              - path: /tmp
            app:
              - path: /tmp
    service:
      app:
        controller: speaches
        ports:
          http:
            port: *port
