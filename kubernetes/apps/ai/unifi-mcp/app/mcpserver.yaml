---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: unifi-mcp
spec:
  alias: unifi_network
  params:
    allow_all_keys: false
    allowed_tools:
      - unifi_get_firewall_group_details
      - unifi_get_firewall_policy_details
      - unifi_get_firewall_policy_ordering
      - unifi_get_network_details
      - unifi_list_firewall_groups
      - unifi_list_firewall_policies
      - unifi_list_firewall_zones
      - unifi_list_legacy_firewall_rules
      - unifi_list_networks
  proxyRef: litellm
  transport: http
  workload:
    automountServiceAccountToken: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
    # renovate: datasource=docker depName=ghcr.io/sirkirby/unifi-network-mcp
    image: ghcr.io/sirkirby/unifi-network-mcp:0.32.4@sha256:0b7cbbf95ca4922197a711f5412f35b893c9353d0963cc8bcf566533aef65af4
    port: 3000
    env:
      - name: HOME
        value: /tmp
      - name: UNIFI_NETWORK_HOST
        value: 10.10.1.1
      - name: UNIFI_NETWORK_PORT
        value: "443"
      # Security gap: trust the controller certificate before expanding write scope.
      - name: UNIFI_NETWORK_VERIFY_SSL
        value: "false"
      - name: UNIFI_NETWORK_USERNAME
        valueFrom:
          secretKeyRef:
            name: unifi-mcp-secret
            key: UNIFI_NETWORK_USERNAME
      - name: UNIFI_NETWORK_PASSWORD
        valueFrom:
          secretKeyRef:
            name: unifi-mcp-secret
            key: UNIFI_NETWORK_PASSWORD
      - name: UNIFI_NETWORK_API_KEY
        valueFrom:
          secretKeyRef:
            name: unifi-mcp-secret
            key: UNIFI_NETWORK_API_KEY
      - name: UNIFI_NETWORK_TOOL_PERMISSION_MODE
        value: confirm
      - name: UNIFI_POLICY_CREATE
        value: "false"
      - name: UNIFI_POLICY_UPDATE
        value: "false"
      - name: UNIFI_POLICY_DELETE
        value: "false"
      - name: UNIFI_POLICY_NETWORK_FIREWALL_POLICIES_CREATE
        value: "false"
      - name: UNIFI_POLICY_NETWORK_FIREWALL_POLICIES_UPDATE
        value: "false"
      - name: UNIFI_POLICY_NETWORK_NETWORKS_CREATE
        value: "false"
      - name: UNIFI_POLICY_NETWORK_NETWORKS_UPDATE
        value: "false"
      - name: UNIFI_TOOL_REGISTRATION_MODE
        value: eager
      - name: UNIFI_MCP_HTTP_ENABLED
        value: "true"
      - name: UNIFI_MCP_HTTP_TRANSPORT
        value: streamable-http
      - name: UNIFI_MCP_HOST
        value: 0.0.0.0
      - name: UNIFI_MCP_PORT
        value: "3000"
      - name: UNIFI_MCP_ALLOWED_HOSTS
        value: unifi-mcp,unifi-mcp.ai,unifi-mcp.ai.svc,unifi-mcp.ai.svc.cluster.local
      - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
        value: "true"
      - name: UNIFI_NETWORK_REDACT_SENSITIVE_FIELDS
        value: "true"
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
