---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unifi-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - ipBlock:
            cidr: 10.10.1.1/32
      ports:
        - port: 443
          protocol: TCP
