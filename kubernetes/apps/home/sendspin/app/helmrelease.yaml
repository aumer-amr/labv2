---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sendspin
spec:
  chartRef:
    kind: OCIRepository
    name: sendspin
  interval: 1h
  values:
    controllers:
      sendspin:
        strategy: Recreate
        initContainers:
          install:
            image: &image
              repository: docker.io/library/python
              tag: 3.14-slim-bookworm
            command: ["/bin/sh", "-ec"]
            args:
              - |-
                apt-get -o APT::Sandbox::User=root update
                mkdir -p /runtime/native /tmp/packages
                cd /tmp/packages
                apt-get -o APT::Sandbox::User=root download libportaudio2 libasound2 libasound2-data libjack-jackd2-0 libstdc++6 libgcc-s1 libsamplerate0
                for package in *.deb; do dpkg-deb --extract "$package" /runtime/native; done
                ldconfig -C /runtime/ld.so.cache /runtime/native/usr/lib/x86_64-linux-gnu /runtime/native/lib/x86_64-linux-gnu
                python -m venv /runtime/venv
                /runtime/venv/bin/pip install --no-cache-dir "sendspin @ https://github.com/Sendspin/sendspin-cli/archive/0125ce1800280426f528bd5ef4e14f2e84a9697b.tar.gz"
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 0
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *image
            command: ["/runtime/venv/bin/sendspin"]
            args:
              - daemon
              - --name
              - living room
              - --url
              - ws://music-assistant-players.home.svc.cluster.local:8927/sendspin
              - --audio-device
              - hw:0,0
              - --settings-dir
              - /config
              - --disable-mpris
              - --hardware-volume
              - "false"
            env:
              LD_LIBRARY_PATH: /runtime/native/usr/lib/x86_64-linux-gnu:/runtime/native/lib/x86_64-linux-gnu
              HOME: /tmp
              PYTHONUNBUFFERED: "1"
            # /dev/snd is root-only; privileged access also permits the ALSA devices.
            securityContext:
              privileged: true
              readOnlyRootFilesystem: true
              runAsUser: 0
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: deathscythe
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config
      runtime:
        type: emptyDir
        advancedMounts:
          sendspin:
            install:
              - path: /runtime
            app:
              - path: /runtime
              - path: /usr/share/alsa
                subPath: native/usr/share/alsa
                readOnly: true
              - path: /etc/ld.so.cache
                subPath: ld.so.cache
                readOnly: true
      sound:
        type: hostPath
        hostPath: /dev/snd
        hostPathType: Directory
        advancedMounts:
          sendspin:
            app:
              - path: /dev/snd
      tmp:
        type: emptyDir
