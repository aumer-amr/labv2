---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: ha-mcp
spec:
  alias: ha_mcp
  params:
    allow_all_keys: false
  workload:
    automountServiceAccountToken: false
    podLabels:
      network.home.arpa/to-envoy-external: allow
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
    # renovate: datasource=docker depName=ghcr.io/homeassistant-ai/ha-mcp
    image: ghcr.io/homeassistant-ai/ha-mcp:8.7.0@sha256:600677bbd7574dfb59682e40d6945f73fcc8852d3684b3671506602473942448
    port: 8086
    command:
      - ha-mcp-web
    env:
      - name: HOMEASSISTANT_URL
        value: https://hass.aumer.dev
      - name: HOMEASSISTANT_TOKEN
        valueFrom:
          secretKeyRef:
            name: ha-mcp-secret
            key: HOMEASSISTANT_TOKEN
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
