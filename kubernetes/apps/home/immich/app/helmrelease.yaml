---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      immich:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        pod:
          labels:
            network.home.arpa/from-envoy-internal: allow
            network.home.arpa/from-envoy-external: allow
            network.home.arpa/to-envoy-internal: allow
            network.home.arpa/to-envoy-external: allow
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.2.4@sha256:d317916b28090c33eb36b308464ea391f8b7df1d850fcfea227a39ec879718c2
            env:
              TZ: Europe/Amsterdam
              IMMICH_CONFIG_FILE: /config/immich.json
              DB_SSL_MODE: require
              REDIS_HOSTNAME: immich-valkey.home.svc.cluster.local
              REDIS_USERNAME: default
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: dbname
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-valkey
                    key: VALKEY_PASSWORD
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 2283
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 2283
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 2283
                  failureThreshold: 60
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    global:
      createDefaultServiceAccount: false
    persistence:
      library:
        existingClaim: immich
        globalMounts:
          - path: /data
      config:
        type: secret
        name: immich-config
        globalMounts:
          - path: /config
            readOnly: true
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            guarded: true
        hostnames:
          - immich.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: immich-health
            group: internal
            url: https://immich.${SECRET_DOMAIN}/api/server/ping
            conditions: ["[STATUS] == 200"]
            alerts:
              - type: pushover
            ui:
              hide-hostname: true
              hide-url: true
        controller: immich
        ports:
          http:
            port: 2283
            appProtocol: kubernetes.io/ws
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-machine-learning
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      immich-machine-learning:
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.2.4@sha256:e16c2f166a8174901959fdf85e2e4c7bd1ebc4b37e0b6655de97c41408a260c4
            env:
              TZ: Europe/Amsterdam
              MPLCONFIGDIR: /cache/matplotlib
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 3003
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 3003
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 3003
                  failureThreshold: 60
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: immich-machine-learning
        ports:
          http:
            port: 3003
    persistence:
      model-cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
