---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      immich:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        pod:
          labels:
            network.home.arpa/from-envoy-internal: allow
            network.home.arpa/from-envoy-external: allow
            network.home.arpa/to-envoy-internal: allow
            network.home.arpa/to-envoy-external: allow
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
            env:
              TZ: Europe/Amsterdam
              IMMICH_CONFIG_FILE: /config/immich.json
              DB_SSL_MODE: require
              REDIS_HOSTNAME: immich-valkey.home.svc.cluster.local
              REDIS_USERNAME: default
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: dbname
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-valkey
                    key: VALKEY_PASSWORD
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 2283
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 2283
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 2283
                  failureThreshold: 60
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # The volume root matches already, but existing library directories do not allow group writes.
        fsGroupChangePolicy: Always
    global:
      createDefaultServiceAccount: false
    persistence:
      library:
        existingClaim: immich
        globalMounts:
          - path: /data
      config:
        type: secret
        name: immich-config
        globalMounts:
          - path: /config
            readOnly: true
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - immich.aumer.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: immich-health
            group: internal
            url: https://immich.aumer.dev/api/server/ping
            conditions: ["[STATUS] == 200"]
            alerts:
              - type: pushover
            ui:
              hide-hostname: true
              hide-url: true
        controller: immich
        ports:
          http:
            port: 2283
            appProtocol: kubernetes.io/ws
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-machine-learning
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      dnsConfig:
        options:
          - name: ndots
            value: "1"
    global:
      createDefaultServiceAccount: false
    controllers:
      immich-machine-learning:
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
            env:
              TZ: Europe/Amsterdam
              HOME: /cache
              MPLCONFIGDIR: /cache/matplotlib
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 3003
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 3003
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 3003
                  failureThreshold: 60
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: immich-machine-learning
        ports:
          http:
            port: 3003
    persistence:
      model-cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
