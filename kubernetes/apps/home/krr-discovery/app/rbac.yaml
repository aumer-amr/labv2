---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: krr-discovery
  namespace: home
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: krr-discovery
  namespace: home
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: krr-discovery
subjects:
  - kind: ServiceAccount
    name: krr
    namespace: observability
