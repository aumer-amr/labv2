---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mealie-secret
    template:
      data:
        OIDC_CLIENT_SECRET: "{{ .KANIDM_CLIENT_SECRET }}"
  data:
    - secretKey: KANIDM_CLIENT_SECRET
      remoteRef:
        key: mealie
        property: KANIDM_CLIENT_SECRET
