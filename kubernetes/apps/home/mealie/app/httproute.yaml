---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mealie
  annotations:
    gatus.home-operations.com/endpoint: |-
      url: https://mealie.${SECRET_DOMAIN}/api/app/about
      conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 48h"]
spec:
  hostnames:
    - mealie.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: mealie
          port: 9000
