---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minecraft
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: network-policies
    - name: coredns
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/home/minecraft/app
  postBuild:
    substitute:
      APP: minecraft
      KOPIUR_CAPACITY: 60Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home
  wait: false
