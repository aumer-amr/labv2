---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
spec:
  chartRef:
    kind: OCIRepository
    name: minecraft
  interval: 1h
  timeout: 35m
  values:
    controllers:
      minecraft:
        strategy: Recreate
        initContainers:
          prepare-data:
            image:
              repository: docker.io/itzg/minecraft-server
              tag: java21
            command: ["mkdir", "-p", "/storage/aeronautics"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            image:
              repository: docker.io/itzg/minecraft-server
              tag: java21
            env:
              TZ: Europe/Amsterdam
              EULA: "TRUE"
              TYPE: AUTO_CURSEFORGE
              CF_SLUG: all-the-mods-10-aeronautics
              CF_FILE_ID: "9022977"
              CURSEFORGE_FILES: schematic-energistics:9041916
              MEMORY: 8G
              DIFFICULTY: normal
              VIEW_DISTANCE: "10"
              ONLINE_MODE: "TRUE"
              ALLOW_FLIGHT: "TRUE"
              ENABLE_RCON: "FALSE"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["mc-health"]
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              startup:
                <<: *probes
                spec:
                  exec:
                    command: ["mc-health"]
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 180
            resources:
              requests:
                cpu: "2"
                memory: 10Gi
              limits:
                memory: 12Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: minecraft
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.10.1.117
          gatus.home-operations.com/endpoint: |-
            name: Minecraft ATM10 Aeronautics
            group: internal
            url: tcp://10.10.1.117:25565
            interval: 1m
            conditions: ["[CONNECTED] == true"]
            alerts:
              - type: pushover
            ui:
              hide-url: true
              hide-hostname: true
        allocateLoadBalancerNodePorts: false
        externalTrafficPolicy: Local
        loadBalancerSourceRanges:
          - 10.10.1.0/24
          - 10.20.0.0/24
        ports:
          minecraft:
            port: 25565
            protocol: TCP
    persistence:
      data:
        existingClaim: minecraft
        advancedMounts:
          minecraft:
            prepare-data:
              - path: /storage
            app:
              - path: /data
                subPath: aeronautics
      tmp:
        type: emptyDir
