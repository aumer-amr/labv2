---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tuppr-minecraft-maintenance
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [minecraft]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # Pod names change on rollout; native RBAC cannot restrict exec by pod labels.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tuppr-minecraft-maintenance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tuppr-minecraft-maintenance
subjects:
  - kind: ServiceAccount
    name: tuppr-minecraft-maintenance
    namespace: system-upgrade
