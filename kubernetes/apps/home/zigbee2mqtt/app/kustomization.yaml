---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./networkpolicy.yaml
  - ./helmrelease.yaml
  - ./oidc.yaml
  - ./ocirepository.yaml
patches:
  - target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
    patch: |-
      - op: replace
        path: /spec/mover/cache/capacity
        value: 5Gi
