---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cilium-policy
spec:
  groups:
    - name: cilium-policy
      rules:
        - alert: CiliumPolicyDeniedFanout
          annotations:
            description: Cilium network policy denied traffic from pod {{ $labels.source_namespace }}/{{ $labels.source_pod }} (workload {{ $labels.source_workload }}) to {{ $value }} distinct IPs in the pod network during the last 5 minutes. Investigate possible scanning or lateral movement.
            summary: Pod {{ $labels.source_namespace }}/{{ $labels.source_pod }} attempted {{ $value }} blocked cluster destinations in the last 5 minutes.
          expr: |-
            count by (source_namespace, source_pod, source_workload) (
              sum by (source_namespace, source_pod, source_workload, destination_ip) (
                increase(hubble_drop_total{
                  reason=~"(?i)policy[ _]denied",
                  source_namespace!="",
                  source_pod!="",
                  destination_ip=~"^10[.]42[.][0-9]{1,3}[.][0-9]{1,3}$"
                }[5m])
                unless on (source_namespace, source_workload, protocol, destination_ip)
                hubble:policy_denied:exclusion
              ) > 0
            ) >= 10
          labels:
            severity: warning
