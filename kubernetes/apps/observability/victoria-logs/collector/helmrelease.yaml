---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: victoria-logs-collector
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: victoria-logs-collector
              spec:
                template:
                  spec:
                    initContainers:
                      - name: queue-permissions
                        image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
                        command:
                          - /bin/sh
                          - -ec
                          - chown -R 65534:65534 /var/lib/vl-collector
                        securityContext:
                          runAsUser: 0
                          runAsGroup: 0
                          runAsNonRoot: false
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: [ALL]
                            add: [CHOWN]
                        volumeMounts:
                          - name: vl-collector-data
                            mountPath: /var/lib/vl-collector
  values:
    fullnameOverride: victoria-logs-collector
    global:
      image:
        registry: quay.io
    podSecurityContext:
      # Host pod logs are root:root 0640; group access avoids changing them.
      supplementalGroups: [0]
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    # Talos /var/lib is 0700; mounting it hides the traversable image directory.
    defaultVolumes:
      - name: varlog
        hostPath:
          path: /var/log
    defaultVolumeMounts:
      - name: varlog
        mountPath: /var/log
        readOnly: true
    podMonitor:
      enabled: true
    remoteWrite:
      - url: http://victoria-logs.observability.svc.cluster.local:9428
        maxDiskUsagePerURL: 10GB
    collector:
      streamFields:
        - kubernetes.pod_name
        - kubernetes.pod_namespace
        - kubernetes.container_name
        - kubernetes.pod_labels.app.kubernetes.io/name
    extraArgs:
      "kubernetesCollector.decolorizeFields": _msg
