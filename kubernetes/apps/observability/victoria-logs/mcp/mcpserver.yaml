---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: victorialogs-mcp
spec:
  alias: victorialogs
  params:
    allow_all_keys: true
    allowed_tools:
      - facets
      - field_names
      - field_values
      - hits
      - query
      - stats_query
      - stats_query_range
      - stream_field_names
      - stream_field_values
      - stream_ids
      - streams
  proxyRef: litellm
  transport: http
  workload:
    automountServiceAccountToken: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
    # renovate: datasource=docker depName=ghcr.io/victoriametrics/mcp-victorialogs
    image: ghcr.io/victoriametrics/mcp-victorialogs:v1.9.0@sha256:753bb4fbe402ca1a782842f44636830f9895736f11d7fe783b924f8a0daf083d
    port: 8081
    env:
      - name: HOME
        value: /tmp
      - name: VL_INSTANCE_ENTRYPOINT
        value: http://victoria-logs.observability.svc.cluster.local:9428
      - name: MCP_SERVER_MODE
        value: http
      - name: MCP_LISTEN_ADDR
        value: 0.0.0.0:8081
      - name: MCP_DISABLED_TOOLS
        value: documentation,flags
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
