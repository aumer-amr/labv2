---
ui:
  title: Health Status
  header: Health Status
  logo: https://raw.githubusercontent.com/aumer-amr/labv2/refs/heads/main/raw/amr.png
  default-sort-by: group

alerting:
  discord:
    webhook-url: ${DISCORD_TLB_WEBHOOK_URL}
  pushover:
    application-token: ${PUSHOVER_API_KEY}
    user-key: ${PUSHOVER_USER_KEY}
    priority: 0
    resolved-priority: 0
    default-alert:
      enabled: true
      description: health-check failed
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 3

metrics: true

endpoints:
  - name: tlbmilsim.com
    group: external-tlb
    url: https://tlbmilsim.com
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: discord
        failure-threshold: 6

  - name: panel
    group: external-tlb
    url: https://panel.tlbmilsim.com
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: discord
        failure-threshold: 6

  - name: mods
    group: external-tlb
    url: https://mods.tlbmilsim.com
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: discord
        failure-threshold: 6

  - name: images
    group: external-tlb
    url: https://images.tlbmilsim.com
    interval: 1m
    conditions:
      - "[STATUS] == 404"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: discord
        failure-threshold: 6

  - name: docs
    group: external-tlb
    url: https://docs.tlbmilsim.com
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: discord
        failure-threshold: 6

  - name: server
    group: external-tlb
    url: https://server.tlbmilsim.com
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: discord
        failure-threshold: 6
    ui:
      hide-url: true
      hide-hostname: true

  - name: P1 management
    group: internal
    url: http://10.40.123.98/
    interval: 1m
    conditions:
      - "[STATUS] == 401"
    alerts:
      - type: pushover
    ui:
      hide-url: true
      hide-hostname: true

  - name: P1 telemetry
    group: internal
    url: https://home-assistant.aumer.dev/api/template
    method: POST
    headers:
      Authorization: Bearer ${HOME_ASSISTANT_TOKEN}
      Content-Type: application/json
    body: >-
      {"template": "{{ 'fresh' if states.sensor.electricity_meter_power_consumption.state not in ['unknown', 'unavailable'] and (now() - states.sensor.electricity_meter_power_consumption.last_reported).total_seconds() < 120 else 'stale' }}"}
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*fresh*)"
    alerts:
      - type: pushover
    ui:
      hide-url: true
      hide-hostname: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

web:
  port: ${GATUS_WEB_PORT}
