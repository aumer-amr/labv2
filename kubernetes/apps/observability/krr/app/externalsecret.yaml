---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: krr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: krr-secret
  data:
    - secretKey: VIKUNJA_API_TOKEN
      remoteRef:
        key: krr
        property: VIKUNJA_API_TOKEN
    - secretKey: PUSHOVER_API_KEY
      remoteRef:
        key: gatus
        property: PUSHOVER_API_KEY
    - secretKey: PUSHOVER_USER_KEY
      remoteRef:
        key: gatus
        property: PUSHOVER_USER_KEY
