---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pr-reviewer-secret-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pr-reviewer-litellm
spec:
  provider:
    kubernetes:
      remoteNamespace: ai
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: pr-reviewer-secret-reader
