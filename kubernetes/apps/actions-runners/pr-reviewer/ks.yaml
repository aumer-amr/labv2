apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pr-reviewer
spec:
  dependsOn:
    - name: actions-runner-controller
      namespace: actions-runner-system
    - name: onepassword-connect
      namespace: external-secrets
    - name: pr-reviewer
      namespace: ai
    - name: gvisor
      namespace: kube-system
    - name: konflate
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/actions-runners/pr-reviewer/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: actions-runners
  wait: true
