            matchLabels:
              app: rook-ceph-mgr
              rook_cluster: rook-ceph
      ports:
        - port: 3300
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: rook-ceph-mds
              rook_cluster: rook-ceph
      ports:
        - port: 3300
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: rook-ceph-crashcollector
              rook_cluster: rook-ceph
      ports:
        - port: 3300
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: rook-ceph-tools
      ports:
        - port: 3300
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: rook-ceph.rbd.csi.ceph.com-ctrlplugin
      ports:
        - port: 3300
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: rook-ceph.cephfs.csi.ceph.com-ctrlplugin
      ports:
        - port: 3300
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: rook-ceph-mon
              rook_cluster: rook-ceph
      ports:
        - port: 3300
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: rook-ceph-mgr
              rook_cluster: rook-ceph
      ports:
        - port: 6800
          endPort: 7568
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: rook-ceph-osd
              rook_cluster: rook-ceph
      ports:
        - port: 6800
          endPort: 7568
          protocol: TCP
    - to:
