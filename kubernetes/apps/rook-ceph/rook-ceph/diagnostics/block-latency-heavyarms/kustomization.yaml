apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -heavyarms
resources:
  - ../block-latency
patches:
  - target:
      kind: Job
      name: ceph-block-latency
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: ceph-block-latency
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: heavyarms
