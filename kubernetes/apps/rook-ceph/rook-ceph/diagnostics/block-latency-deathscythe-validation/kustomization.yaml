apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -validation
resources:
  - ../block-latency-deathscythe
patches:
  - target:
      kind: Job
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: ceph-block-latency
      spec:
        activeDeadlineSeconds: 120
        template:
          spec:
            containers:
              - name: tracer
                args: [/capture/run.sh, "60"]
