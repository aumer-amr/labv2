---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrepository.yaml
  - ./helmrelease.yaml
  - ./rbac.yaml
  - ./prometheusrule.yaml
  - ./grafanadashboard.yaml
configMapGenerator:
  - name: tetragon-policies
    files:
      - policies/echo-unexpected-exec.yaml
      - policies/echo-file-access.yaml
  - name: tetragon-pilot-dashboard
    files:
      - dashboard.json=resources/dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    kustomize.toolkit.fluxcd.io/ssa: Merge
