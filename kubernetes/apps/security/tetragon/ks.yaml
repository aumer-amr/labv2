---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tetragon
spec:
  dependsOn:
    - name: network-policies
    - name: kube-prometheus-stack
      namespace: observability
    - name: victoria-logs-collector
      namespace: observability
    - name: flux-instance
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/security/tetragon/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  wait: true
