---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}-valkey
spec:
  chartRef:
    kind: OCIRepository
    name: valkey-v1
    namespace: database
  interval: 1h
  # Keep the existing ingress-only policy without the chart's added peer or egress rules.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: networking.k8s.io
              kind: NetworkPolicy
              name: ${APP}-valkey
            patch: |-
              - op: remove
                path: /spec/ingress/0
              - op: remove
                path: /spec/egress
              - op: replace
                path: /spec/policyTypes
                value: [Ingress]
  values:
    auth:
      enabled: true
      usersExistingSecret: ${APP}-valkey
      aclUsers:
        default:
          passwordKey: VALKEY_PASSWORD
          permissions: "~* &* +@all"
    persistence:
      enabled: false
    deploymentStrategy: Recreate
    fullnameOverride: ${APP}-valkey
    metrics:
      enabled: false
    networkPolicy:
      enabled: true
      allowExternal: false
      allowExternalEgress: false
      extraIngress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: ${APP}
          ports:
            - port: 6379
              protocol: TCP
    podDisruptionBudget:
      enabled: false
    readinessProbe:
      enabled: true
    replica:
      enabled: false
    resources:
      requests:
        cpu: ${VALKEY_CPU_REQUEST:=10m}
        memory: ${VALKEY_MEMORY_REQUEST:=64Mi}
      limits:
        cpu: ${VALKEY_CPU_LIMIT:=500m}
        memory: ${VALKEY_MEMORY_LIMIT:=256Mi}
    extraConfig: |-
      maxmemory ${VALKEY_MAXMEMORY:=192mb}
      maxmemory-policy ${VALKEY_MAXMEMORY_POLICY:=allkeys-lru}
